# Coverage of latitudesh-go-sdk service groups by this Terraform provider.
#
# This is an EXCEPTION LIST, not a work queue. A group with no entry here is one we
# intend to expose, and scaffolding is generated for it automatically. Nothing waits
# on a human writing a line first.
#
# The flow:
#
#   1. The SDK exposes a group with no entry.
#   2. Scaffolding is generated for it — a resource, a data source, or both,
#      according to the CRUD shape derived from its method names.
#   3. A draft PR opens. Reviewing real generated code is where the keep-or-drop
#      decision actually gets made.
#   4. Merge it and the agent's entry lands in `implemented_by` — the group is
#      covered. Drop it and record why below, so it stops being regenerated.
#
# Derived automatically on every run, never stored here: each group's CRUD shape.
# So the shapes cannot rot against the SDK.
#
# CAVEAT: those shapes come from the SDK, which is generated from the API's OpenAPI
# spec. When the spec is incomplete the shape understates the real API — verified
# cases are noted below. Read a shape as a floor, not a ceiling.
#
# ## Fields
#
# implemented_by  Terraform type names this group backs. Non-empty means covered.
#                 There is no separate status field: two sources of truth for the
#                 same fact are free to contradict each other.
#
# ceiling         caps how much gets generated. Only on exclusions — "generate
#                 everything the shape supports" is expressed by having no entry.
#   none             generate nothing
#   datasource       a data source is fine, do not generate a resource
#
# rationale       why it is capped. Required whenever ceiling is set, and vice
#                 versa: a cap without a reason is unauditable, a reason without a
#                 cap does not say how much to stop.
#   api_constraint    the API does not offer enough to go further
#   product_decision  we do not want it, whatever the API offers
#   deprecated        the upstream endpoint is going away
#
# notes           context for whoever reviews this group next. Valid on its own —
#                 an entry with only notes still generates, it just arrives with the
#                 reviewer already warned.
#
# Why rationale matters: it decides whether an exclusion expires. An api_constraint
# is only true while the API stays put, so the report re-checks it every run and
# flags groups that have outgrown their ceiling. That flag never fails CI — an API
# that grew is an opportunity, and whoever bumps the SDK is not who decides product
# scope. A product_decision is exempt from the check entirely.
#
# ## The gate
#
# `TestProviderSDKCoverage` fails only on contradictions:
#   - an entry names a group the SDK no longer exposes (renamed or removed upstream)
#   - implemented_by names a Terraform type the provider does not register
#   - the provider registers a type no entry claims
#   - a ceiling without a rationale, or a rationale without a ceiling
#   - a covered group that still carries a ceiling or rationale
#
# A group with no entry is NOT a failure — that is the generation trigger.
#
# Regenerate the raw surface with: go run ./cmd/sdkcoverage groups
# Render the coverage table with:  make coverage-report

version: 1
sdk_module: github.com/latitudesh/latitudesh-go-sdk

groups:
  # ---------------------------------------------------------------- covered ---

  Billing:
    implemented_by: [latitudesh_billing]

  ElasticIps:
    implemented_by: [latitudesh_elastic_ip, latitudesh_elastic_ip_bgp]

  Firewalls:
    implemented_by: [latitudesh_firewall, latitudesh_firewall_assignment]
    notes: >-
      Assignment methods are flattened onto this group (ListAssignments,
      DeleteAssignment) as well as living on Firewalls.Assignments.

  Firewalls.Assignments:
    implemented_by: [latitudesh_firewall_assignment]
    notes: >-
      Only Create lives here; the read and delete paths are on the parent group.
      v1.19.17 reshaped the Create response body (components.FirewallServer):
      id/type/attributes moved under a nested data envelope, attributes gained
      server/virtual_machine and dropped server_id, and FirewallServerType's
      enum value renamed firewall_servers -> firewall_assignments. None of it
      is mapped: the resource never reads the Create response body (it always
      re-derives the assignment ID via a follow-up ListAssignments call, see
      findAssignmentByTargetAndFirewall), so the reshape closes with a lock
      sync and no code change. Virtual-machine targets are wired up:
      operations.CreateFirewallAssignmentFirewallsAssignmentsAttributes.VirtualMachineID
      is exposed as the virtual_machine_id attribute (exactly one of
      server_id/virtual_machine_id, matching the API contract), and the
      read path maps the target from
      components.FirewallAssignmentDataAttributes.Server/.VirtualMachine.

  Lks:
    implemented_by: [latitudesh_lks, latitudesh_lks_clusters, latitudesh_lks_node_pool,
      latitudesh_lks_node_pools, latitudesh_lks_kubeconfig, latitudesh_lks_sites,
      latitudesh_lks_versions]
    notes: >-
      Fully mapped: all 13 methods. LKS (Latitude Kubernetes Service) is an
      acronym, not a plural, so the types keep the trailing s and the two
      list data sources are spelled out (latitudesh_lks_clusters,
      latitudesh_lks_node_pools) rather than following the usual singular+s
      pair — SuggestTypeName's singularize rule would otherwise propose
      latitudesh_lk.

      Two products live in this one SDK group and each gets its own
      resource, because a cluster with no node pool is a control plane that
      schedules nothing:
      - latitudesh_lks maps LksCluster (Create/Get/Update/Delete, plus
        ListLksClusters behind latitudesh_lks_clusters, project-scoped). It
        also carries a REQUIRED default_node_pool block, which is structural
        rather than stylistic: a cluster converges only once it has a node
        pool, CreateLksClusterAttributes takes none inline, and Terraform
        will not start a separate pool resource until this Create returns —
        so the first pool must be created inside this Create, or the cluster
        could never be waited on at all (confirmed by the team,
        2026-09-17). Folding it in makes the requirement enforceable at plan
        time AND lets Create legitimately wait for status "ready"; pinned by
        TestLks_CreateWaitsForReadyViaDefaultNodePool, whose mock reports
        "ready" only after a pool has been POSTed. Same split as
        azurerm_kubernetes_cluster.default_node_pool and
        digitalocean_kubernetes_cluster.node_pool. Changing plan or
        max_pods_per_node inside the block replaces the POOL, not the
        cluster, building the replacement before removing the old one —
        deliberately better than azurerm, where that edit rebuilds the whole
        cluster. On the cluster itself, name/description/kubernetes_version
        update in place; project, site and network carry RequiresReplace.
      - latitudesh_lks_node_pool maps LksNodePool (Create/Get/Update/Delete,
        plus ListLksNodePools behind latitudesh_lks_node_pools,
        cluster-scoped) for every pool BEYOND the first. node_count (named
        around Terraform's reserved `count` meta-argument), name,
        description, kubernetes_version, labels and taints update in place;
        cluster_id, plan and max_pods_per_node carry RequiresReplace — the
        last because the API rejects a PATCH carrying it with 422. Apply
        waits on ready_nodes reaching node_count rather than on a status
        value: this endpoint documents no status enum, and a scale is
        asynchronous. latitudesh_lks manages only the pool recorded in its
        default_node_pool and ignores every other one, so the two resources
        never contend for the same object — the ambiguity that makes
        google_container_cluster.node_pool fight google_container_node_pool.

      GetLksClusterKubeconfig ships as the latitudesh_lks_kubeconfig
      EPHEMERAL resource, not a data source: a kubeconfig is cluster-admin
      credentials, and a data source would write them to state and to every
      plan file. The endpoint answers 409 NOT_READY until the control plane
      is up — a window the cluster's own create already closes, so depending
      on latitudesh_lks is enough to order the read. An LKS kubeconfig does
      not expire (confirmed by the team,
      2026-09-17), so the ephemeral implements neither Close nor Renew:
      there is nothing to revoke and nothing to refresh mid-apply, unlike
      aws_eks_cluster_auth (15-minute token, and an open renewal bug) or
      DigitalOcean's 7-day default. The response model carries no expires_at
      either, which is consistent. Non-expiry is also the argument FOR
      keeping this off state rather than against it: a leaked copy stays
      valid forever.

      Its schema is one attribute, `kubeconfig`, because that is the whole
      of LksClusterKubeconfigAttributes ("Full kubeconfig YAML"). A first
      revision also published host/cluster_ca_certificate/client_certificate/
      client_key/token parsed out of the document, mirroring
      upcloud_kubernetes_cluster and digitalocean_kubernetes_cluster.
      kube_config. It was removed on review: the API documents nothing about
      which authentication method LKS issues, so a schema offering both a
      certificate pair and a token — each described as "null when the
      cluster uses the other" — would have been presenting a guess as
      contract, in generated docs that read as authoritative. Callers
      yamldecode() the document instead, which puts the assumption in their
      configuration where it is visible. Revisit only if the API starts
      specifying the fields.

      ListLksSites and ListLksAvailableVersions are global reference lookups
      (no project/cluster scope, no parameters, no pagination) and ship as
      latitudesh_lks_sites / latitudesh_lks_versions. They are the only
      source of the valid values for site and kubernetes_version: both are
      open strings the API validates, so no OneOf validator is possible and
      a typo would only fail at apply. The family's third reference lookup,
      latitudesh_lks_plans, is generated into the Plans group instead
      (Plans.GetLksPlans, GET /plans/lks) and is recorded there — a node
      pool needs all three: a site, a version and a plan.

      Update rules, read out of the API and dashboard repos 2026-09-18 — none
      of these are in the swagger the SDK is generated from, and each one
      breaks an obvious implementation:

      - A scale and an upgrade may NOT share a PATCH. `count` together with
        `kubernetes_version` is a 422 (NodePoolUpdater raises
        DisruptiveOpConflict); the dashboard guards against it client-side.
        Because kubernetes_version is Optional+Computed with
        UseStateForUnknown, the plan always carries a known value after
        create, so sending both unconditionally fails EVERY update, not just
        the combined one. lksPatchNodePool splits them: metadata+count first,
        then the version, waiting in between — which also keeps the second
        request clear of the admission check's 422 "operation in progress".
      - labels/taints are a declarative whole-collection REPLACE. An absent
        key leaves them unchanged; `{}` / `[]` clears; a populated value
        replaces rather than merges. The swagger says so in prose. But the
        SDK cannot send an empty one: both fields are tagged `omitempty`, and
        Go drops nil and empty alike, so removing a taint PATCHed nothing and
        the apply died on the read-back (hit live). Worked around in
        latitudesh/lks_clear_transport.go, which injects the empty collection
        into the outgoing PATCH, signalled through the request context and
        scoped by regex to the node pool path. The dashboard sends exactly
        the same `{"labels":{},"taints":[]}` on update while omitting them on
        create, which is also what this provider does.
        TestLksNodePoolUpdateCannotClearCollections fails when the SDK marks
        the fields nullable, which is the signal to delete the workaround.
      - `description` CANNOT be cleared at all, and it is not the same case
        despite an identical symptom. The SDK could send it — `omitempty` on
        a *string drops only nil, so a pointer to "" does reach the wire —
        but both update contracts declare
        `optional(:description).filled(:string)`, so "" is a 422 ("must be
        filled"), and an explicit null is dropped by the controller's
        `.compact` before reaching the writer. Sending "" on every update
        where the attribute is null would therefore fail every update. The
        provider sends nothing, and removing a description from
        configuration still cannot converge — an API limitation, not a
        provider one. Revisit if `filled` is relaxed.
      - `max_pods_per_node` in a PATCH is always a 422 ("cannot be changed
        after the node pool is created"), which is why it carries
        RequiresReplace and is absent from every update payload.
      - Waits key off LKSService::MutationAdmission's IN_PROGRESS_STATES
        (provisioning/updating/scaling/upgrading), not a literal terminal
        string. Comparing against "ready" is a guess that hangs a healthy
        cluster the moment the platform reports anything else, and
        `ready_nodes` is a bare passthrough on the API side with no default,
        so it can be absent entirely — a wait gated only on that number polls
        until its timeout on a pool that is demonstrably up. Settled status
        is the authority; the count refines it when reported. paused,
        deleting and deleted fail fast, since no amount of waiting reaches
        ready from there.
      - The DEFAULT pool must stay schedulable: a NoSchedule or NoExecute
        taint on latitudesh_lks.default_node_pool leaves the cluster's own
        system workloads with nowhere to run, so it never leaves
        "provisioning" (confirmed by the team, 2026-09-18). The API accepts
        the taint and the apply reports success, so the only symptom is a
        readiness wait that times out — which is why
        lksDefaultPoolTaintsValidator rejects it at plan time instead.
        PreferNoSchedule is allowed (soft), and latitudesh_lks_node_pool is
        deliberately unrestricted: a hard taint on an additional pool is the
        normal way to reserve one.
      - An unset `description` comes back as "" rather than absent (seen live
        2026-09-18 on a node pool whose config never gave one). Copied into
        state verbatim that is a diff that can NEVER converge, since the API
        rejects "" on the way back in and ignores null — so
        lksDescriptionFromAPI collapses "" to null, but only when the
        configured value is already null, which keeps a genuine out-of-band
        change visible.
      - The node pool serializer defaults labels to {} and taints to [] on
        READ, never null — which is why mapLksNodePoolAttributes maps an
        empty collection back to null, so a config that omits them sees no
        perpetual diff.
      - Client-side validation matches V3::LKS::NodePoolMetadataRules on the
        50-entry cap, the reserved prefixes and the taint effects. NOT yet
        mirrored: the key/value format rules (63-char name, 253-char prefix,
        DNS-label prefixes) — those still fail server-side with a 422.

      API error shape, observed live 2026-09-18: JSON:API prescribes `status`
      as the HTTP code as a string, and the SDK's examples use "404", but the
      live LKS endpoints render it snake_case ("not_found") with a matching
      `code` ("NOT_FOUND"). lksClusterNotFound accepts both spellings on
      either field — it backs every Read, Delete and poller for clusters and
      node pools, and matching only "404" made destroy fail on a cluster it
      had just successfully deleted. Whether 5xx is spelled the same way has
      NOT been observed, so lksRetryableDuringPoll still only recognizes the
      numeric form there; missing one costs a fast failure instead of a
      retry, which is visible rather than silent.

      Reviewer flag: KubernetesClusters below is capped
      `ceiling: none, rationale: deprecated` for exactly this product
      (managed Kubernetes) — confirm Lks is the intended non-deprecated
      successor before merging, not a second implementation of the same
      thing under a new SDK group name.

  ManagedDatabases:
    implemented_by: [latitudesh_managed_database_metrics]
    notes: >-
      Data source. ShowManagedDatabaseMetrics is the only method on this
      group (crud shape -R--) and it is the one mapped: managed_database_id,
      period and queries drive the request, and from/to/metrics (a map keyed
      by metric name, each entry carrying unit/current/points) back the
      response. No methods are left unmapped.

  MarketplaceApps:
    implemented_by: [latitudesh_marketplace_app, latitudesh_marketplace_apps]
    notes: >-
      Data sources. Both methods are mapped: GetMarketplaceApp backs the
      singular `latitudesh_marketplace_app` id/slug lookups,
      ListMarketplaceApps backs both its name lookups and the plural
      `latitudesh_marketplace_apps` catalog listing (list + in-memory
      filter, since the list call takes no filter parameters and does not
      paginate). No methods are left unmapped. Both endpoints only return
      published apps and require the `marketplace_apps` feature to be
      enabled for the team, per the SDK doc comments — a team without that
      feature enabled or with the app unpublished will see 404s the same as
      a genuinely missing id/slug/name. Presentation-only catalog fields on
      MarketplaceAppDataAttributes are not exposed by team decision
      (2026-09-01) — description, short_description, access_instructions,
      upstream_url, documentation_url, logo_url, created_at serve catalog
      browsing, not provisioning; do not map them.

  OperatingSystems:
    implemented_by: [latitudesh_operating_system]
    notes: >-
      Data source. ListPlans is the group's only method and is fully mapped —
      no methods are left unmapped. OperatingSystemDataAttributes carries no
      presentation-only fields (no description, logo, URL, or timestamp), so
      every attribute (name, slug, distro, user, version, provisionable_on,
      features) is exposed; nothing was deliberately excluded. ListPlans
      paginates (page[size]/page[number]); since there is no single-item read,
      lookup by id, slug, or name all walk the list via response.Next until a
      match is found or pages are exhausted.

  Plans:
    implemented_by: [latitudesh_plan, latitudesh_lks_plans]
    notes: >-
      Data source. UpdateBandwidth is not wired up, hence the -RU- shape.
      GetBandwidth, GetManagedDatabasePlans and ListStorage are likewise
      unmapped — latitudesh_plan only calls Get and List. StoragePlanData
      (the model behind ListStorage) has no backing Terraform type at all.
      GetLksPlans (GET /plans/lks) ships as latitudesh_lks_plans: it lives in
      this SDK group but belongs to the LKS family by use, so it is named for
      the family it serves rather than for the group it is generated into —
      the slugs it returns are the only valid value for an LKS node pool's
      plan and are NOT interchangeable with latitudesh_plan's server plans.
      It is a list, not a lookup: the endpoint takes no selector. Pricing is
      deliberately left unmapped there too, holding the same boundary
      latitudesh_plan holds (see the v1.19.19 drift note below); the
      regions[] it does expose carry locations.available / locations.in_stock
      / locations.in_stock_count and stock_level, which is what makes a
      site+plan pair buildable or not. That last one is also surfaced
      flattened as plans[].in_stock_count, keyed by site slug (a site belongs
      to exactly one region, so merging is lossless). The data source also
      takes an optional `site`, and then answers with a top-level `stock`
      map of slug -> node count containing only plans that can build there —
      so choosing a plan for a site costs no loop and no filtering in
      configuration, which is how every example and the manual scenario do
      it. Same shape as latitudesh_marketplace_apps' `category` filter,
      including the synthetic id reflecting the filter.

      v1.19.19 drift closure (lock synced 2026-09-02): no mapping change.
      components.PlanDataAttributes.Regions (and, on the storage side,
      StoragePlanDataAttributes.Regions) has never been exposed by
      latitudesh_plan — the schema only surfaces slug/name/features/specs;
      regions, pricing and available_operating_systems are absent from both
      the schema and the Read mapping today, predating this drift. This PR
      continues that boundary rather than deciding it fresh.

      Deliberately left unmapped (all under the unmapped Regions surface):
      - components.PlanDataPricing.BRL/.USD (removed) and their backing
        components.PlanDataBRL/.PlanDataUSD models (removed): the currency
        struct fields are gone from the SDK, replaced by
        components.PlanDataPricing.hour/.month/.year (new *float64 fields).
      - components.PlanDataRegions.pricing: type changed from
        *PlanDataPricing to map[string]PlanDataPricing (now keyed by ISO
        4217 currency code per the updated SDK doc comment) — a shape change
        to a field this data source never read.
      - The identical BRL/USD -> flat-pricing shape change on the storage
        side: components.StoragePlanDataPricing.BRL/.USD (removed) and their
        components.StoragePlanDataBRL/.StoragePlanDataUSD models (removed),
        components.StoragePlanDataPricing.month (new), and
        components.StoragePlanDataRegions.pricing (type changed from
        *StoragePlanDataPricing to map[string]StoragePlanDataPricing).

      Reopen this if a future PR decides to expose plan/region pricing as a
      new attribute — see the handoff for the v1.19.19 drift PR for the
      reviewer flag.

  Plans.VM:
    implemented_by: [latitudesh_plan_vm]
    notes: >-
      Data source. List is the only method on the VM sub-group (crud shape
      -R--) and it is the one mapped — no methods are left unmapped.
      VirtualMachinePlansAttributes carries no presentation-only fields (no
      description, logo, URL, or catalog timestamp), so every attribute is
      exposed (memory, gpu, vram_per_gpu, vcpus, vcpu, nics, disk, regions,
      stock_level, available_operating_systems). The only field left out is
      VirtualMachinePlansData.Type, the constant JSON:API envelope
      discriminator ("virtual_machine_plans" on every row) — not exposed by
      team decision, it carries no information.

      Unlike the sibling `Plans` group above, regions (including per-currency
      pricing and locations) ARE exposed here: this is a fresh mapping, not
      one inheriting a pre-existing schema boundary, and stock/pricing by
      region is exactly the "capacity" information a practitioner needs to
      pick a plan that is actually available where they want to deploy.

      GetVMPlansResponse carries no Next field, so List does not paginate —
      lookup by id, slug, or name all walk the single response in memory.
      VM.List takes an optional filterGpu *bool query param; it is not
      surfaced as a schema attribute (the id/slug/name selectors already
      narrow to one plan) and List is always called with filterGpu=nil so no
      plan is excluded from the in-memory scan.

  PrivateNetworks:
    implemented_by: [latitudesh_virtual_network, latitudesh_vlan_assignment]
    notes: >-
      Owns CRUD for virtual networks and the assignment lifecycle. Neither
      Terraform type is named private_network.

  Projects:
    implemented_by: [latitudesh_project]

  PublicNetworks:
    implemented_by: [latitudesh_public_network]

  Regions:
    implemented_by: [latitudesh_region]
    notes: Data source. Reads a single region via Fetch, not Get.

  Roles:
    implemented_by: [latitudesh_role]

  SSHKeys:
    implemented_by: [latitudesh_ssh_key]
    notes: Ships as both a resource and a data source under the same type name.

  Servers:
    implemented_by: [latitudesh_server, latitudesh_server_reinstall, latitudesh_server_power]
    notes: >-
      Lock/Unlock/GetDeployConfig are folded into the resource's create and update
      paths rather than exposed separately. Reinstall is folded in too (an update
      that changes a reinstall-only field) and additionally exposed as the
      latitudesh_server_reinstall action, for reinstalling without changing
      desired state. RunAction is exposed as the latitudesh_server_power action
      (DX-144). The remaining operations (rescue mode, IPMI, out-of-band,
      scheduled deletion) are planned as further DX-144/DX-145 work.

      v1.19.17 drift closure (lock synced 2026-08-29): mapped
      components.ServerDataAttributes.legacy_network -> new Computed
      legacy_network and .features -> new Computed features (list) on
      latitudesh_server, both straightforward read-only refreshes.

      v1.19.20 drift closure (lock synced 2026-09-04): all 16 rows were new
      filter[...] fields (plus two doc_changed rows) on
      operations.GetServersRequest — lock synced only, no mapping, per the
      pre-existing GetServersRequest.sort note below.

      Deliberately left unmapped:
      - components.DeployConfigAttributes.ipxe_url: legacy field per team
        decision (2026-08-31) — not exposed as an attribute; the provider's
        ipxe input remains the supported iPXE path.
      - components.Credentials / components.ServerDataAttributes.credentials /
        components.ServerDataSSHKeys: "latest provisioning credentials,
        lazy loaded" per the SDK doc — only populated when the GET is called
        with extra_fields[servers]=credentials, which readServer never
        requests. Surfacing root passwords is a deliberate product decision
        (sensitive attribute, cache/rotation semantics), not a mechanical
        field mapping — flagged for the reviewer as a possible follow-up.
      - components.DeployConfigAttributes.ipxe (the raw script field): the
        resource's existing ipxe attribute is Optional-only (no Computed),
        so refreshing it from the deploy config would require flipping it
        to Optional+Computed — a schema/plan-modifier call this PR does not
        make. Flagged for the reviewer.
      - components.ServerDataFeatures.accelerate/rescue/workflow: these live
        on components.OperatingSystem.Features, a nested struct this
        provider has never mapped into any attribute (OS capability
        metadata, not server config); unaffected by this drift.
      - components.DeployConfig.meta / components.DeployConfigData.type /
        components.DeployConfigMeta / components.DeployConfigType: JSON:API
        envelope additions on the deploy-config GET response, no business
        data.
      - components.DeployConfigFilesystem "xfs" enum value removed /
        operations.UpdateServerDeployConfigServersFilesystem "xfs" removed:
        filesystem is API-managed and intentionally not in the disk_layout
        schema (see its MarkdownDescription), so no coercion site exists to
        update.
      - operations.UpdateServerDeployConfigServers* (RequestBody reshaped:
        attributes/type -> data; Attributes gained ipxe; Filesystem enum):
        Servers.UpdateDeployConfig is never called anywhere in this
        provider — disk_layout/ipxe/raid changes go through Servers.Reinstall
        instead — so the whole request-body reshape is dead surface for us.
      - operations.GetServersRequest.sort and all of its filter[...] fields
        (including the filter[created_at], filter[id], and
        filter[hostname|label|plan][eql|match|prefix|suffix] fields added in
        v1.19.20): Servers.List / GetServersRequest is never called anywhere
        in this provider — no server list/data source exists to take a sort
        or filter parameter, so the whole request type is dead surface. The
        filter[created_at_gte]/[created_at_lte] doc_changed rows in the same
        v1.19.20 bump fall under this too, for the same reason.
      - operations.CreateServerServersAttributes.public_network /
        .public_network_id (new, both **Preview**, gated to teams with
        public networks enabled), plus the already-unmapped (pre-existing,
        only doc_changed here) components.ServerDataAttributes.public_network
        / components.ServerDataPublicNetwork read-back, and the matching
        doc_changed rows on CreateServerReinstallServersAttributes.public_network
        and UpdateServerDeployConfigServersAttributes.public_network(_id):
        attaching a server to a public network is a coherent small feature
        (create-time attribute(s) + a read-back nested object), but deciding
        its plan-modifier shape (does changing public_network_id force a
        replace, or does it go through Reinstall like disk_layout/ipxe?) is
        exactly the kind of API-behavior judgment this task defers to a
        human. Not built here; flagged for the reviewer as a candidate
        follow-up once someone can verify attach/detach semantics against
        the live API.
      - components.ServerDataAttributes.status doc_changed (now documented
        as an open set, not a closed enum) and the paired breaking
        field_type_changed (*ServerDataStatus -> *string): already handled
        correctly pre-drift — readServer and waitForServerStatus both do
        string(*attrs.Status) and compare status by plain string equality,
        never switching over the old named type, so both continue to
        compile and behave identically. No code change; verified by
        `go build`.

  Tags:
    implemented_by: [latitudesh_tag]
    notes: Also read by the server and virtual-network resources.

  TeamMembers:
    implemented_by: [latitudesh_member]

  Teams.Members:
    implemented_by: [latitudesh_member]
    notes: Supplies the read path for latitudesh_member via GetTeamMembers.

  UserData:
    implemented_by: [latitudesh_user_data]
    notes: Also read by the server resource to hash user-data content.

  VirtualMachines:
    implemented_by: [latitudesh_virtual_machine, latitudesh_virtual_machine_power]
    notes: >-
      Network attachments and metrics are not exposed. Note the update method is
      UpdateVirtualMachine, not Update. marketplace_app is exposed as a
      slug-only string attribute (mirroring how operating_system exposes only
      Slug); the nested name/version fields on
      VirtualMachineAttributesMarketplaceApp are deliberately not surfaced.
      CreateVirtualMachineAction is exposed as the latitudesh_virtual_machine_power
      action (DX-144).

  VirtualNetworks:
    implemented_by: [latitudesh_virtual_network]
    notes: >-
      Delete-only fragment — PrivateNetworks owns the rest of the lifecycle. The
      derived ---D shape is expected and is not a gap.

  VirtualMachineRestores:
    implemented_by: [latitudesh_virtual_machine]
    notes: >-
      Covered by `backup_id` on latitudesh_virtual_machine, not by a type of its
      own: a restore is an operation whose only handle is an opaque id, so a
      lookup adds nothing over the create response (the data source scaffolded
      for this group was dropped on review, PR #248). The resource calls Create
      (flat POST /virtual_machine_restores) and polls Get until Ready, then
      adopts the virtual machine the restore produced - the VM create payload
      has no backup source, so this is the only way to build a VM from a
      backup. Verified live 2026-09-04: routes exist, restores have no
      Delete/Update, virtual_machine is null until Ready, and the restored VM
      ends Running with an IPv4. Unmapped: CreateForVirtualMachineBackup (the
      VM-nested POST, same operation) and List/ListForBackup/
      ListForVirtualMachineBackup (browsing restore history has no Terraform
      use; a backup can be restored many times, so none is a unique selector).

  # --------------------------------------------------------------- excluded ---

  BaselinesPreview:
    ceiling: none
    rationale: product_decision
    notes: >-
      Baselines is still under active development and its preview API is not
      stable, so scaffolding against it now would only churn. Revisit once the
      product ships.

  FilesystemStorage:
    ceiling: none
    rationale: product_decision
    notes: >-
      Filesystem storage is gated — a customer has to request access before it
      can be created — so it is not a general Terraform surface yet. Revisit if it
      becomes generally available. Shape context: the API genuinely has no
      single-item read (confirmed against the routes), so import support would
      need thought — an API limitation, not a spec gap.

  IPAddresses:
    ceiling: none
    rationale: api_constraint
    notes: >-
      The /ips collection is not settled enough yet to model as a data source.
      Revisit on a later SDK bump.

  KubernetesClusters:
    ceiling: none
    rationale: deprecated
    notes: >-
      Managed Kubernetes is being deprecated, so we are not adding Terraform
      support for it. Shape context: kubeconfig retrieval and available-version
      listing would each likely want their own data source, and
      GET /kubernetes_clusters/plans exists in the API but is absent from the
      spec, so the SDK has no method for it.

  Projects.SSHKeys:
    ceiling: none
    rationale: deprecated
    notes: >-
      PostProjectSSHKey is marked Deprecated in the SDK, and the API route
      /projects/:project_id/ssh_keys is deprecated too. Project SSH keys are
      managed through the SSHKeys group instead.

  Teams:
    ceiling: none
    rationale: product_decision
    notes: >-
      Team management does not belong in Terraform, not even as a data source.
      (The API also has no DELETE and no show, so a resource could not be
      well-formed anyway — but the decision stands regardless of that.)

  VpnSessions:
    ceiling: none
    rationale: product_decision
    notes: >-
      A VPN session is ephemeral; Terraform state would be stale the moment after
      apply. Not a Terraform concern whatever the API offers.

  # ------------------------------------------------------------ annotations ---
  # No ceiling, so these still generate. The notes are here so whoever reviews the
  # generated PR starts with the context already gathered.

  ObjectStorage:
    implemented_by: [latitudesh_object_storage, latitudesh_object_storage_access_key]
    notes: >-
      The CR-D shape UNDERSTATES the API: PATCH /storage/buckets/:id is routed and
      implemented but missing from the spec, as are the lifecycle_rules
      sub-resource, a metrics endpoint, and a bucket-exists check. Scoped
      previously as PD-6063 and paused pending storage-team spec fixes. The
      generated resource lacks update support it could have had: every attribute
      is RequiresReplace. PostStorageBuckets/GetStorageBucket/GetStorageBuckets/
      DeleteStorageBuckets back latitudesh_object_storage (resource + data source).
      PostStorageAccessKeys/GetStorageAccessKeys/DeleteStorageAccessKeysUsername
      back latitudesh_object_storage_access_key (managed resource with optional
      pgp_key, plus an ephemeral resource sharing the create/delete calls).
      Unmapped: GetStorageBucketAccessKeys (per-bucket key listing, read-only);
      PostStorageBucketLifecycleRules,
      GetStorageBucketLifecycleRules, GetStorageBucketLifecycleRule,
      PatchStorageBucketLifecycleRule, DeleteStorageBucketLifecycleRule (the
      lifecycle_rules sub-resource, its own CRUD lifecycle keyed by bucket_id +
      rule id); GetStorageBucketMetrics and GetStorageUsage (read-only
      usage/metrics reporting, candidates for their own data sources later).

  VirtualMachineBackups:
    implemented_by: [latitudesh_virtual_machine_backup, latitudesh_virtual_machine_backups]
    notes: >-
      Routes verified live 2026-09-04 (the API checkout reviewed 2026-06-22 had
      no HTTP routes; production does). The resource wires the top-level Create
      (POST /virtual_machine_backups, body carries virtual_machine), Get and
      Delete (a soft delete: the backup lingers as Archived, treated as
      terminal). The plural data source latitudesh_virtual_machine_backups maps
      List (team-wide) and ListForVirtualMachine (VM-scoped) with a client-side
      status filter, newest first, so backups[0] feeds backup_id on
      latitudesh_virtual_machine. Unmapped: CreateForVirtualMachine, the
      VM-nested POST variant of the same create. The nested team and project
      envelope objects on the read response are not exposed beyond the
      project's identifying slug (account/billing management, not backup
      provisioning).

  APIKeys:
    notes: >-
      Full CRUD, but managing API keys through Terraform means the key material
      lands in state — weigh that when reviewing.

  BlockStorage:
    notes: >-
      Methods are HTTP-verb prefixed (PostStorageVolumes, DeleteStorageVolumes),
      DeleteStorageVolumes deletes a single volume despite the plural, and the
      API has no volume update, so the CR-D shape is real and not a spec gap.
      Beyond that shape sit three attachment verbs the derived CRUD cannot
      express: PostStorageVolumesMap and PostStorageVolumesUnmap (map a
      high-performance volume to a server over NVMe-TCP, and unmap it) and
      PostStorageVolumesMount (mount by adding the client to an allowed list).
      Decide on review whether attachment belongs on the volume resource or on a
      separate type.

  Traffic:
    notes: >-
      Read-only reporting. The API changes its response shape based on a project
      feature flag, so a data source needs to handle both.
