# Coverage of latitudesh-go-sdk service groups by this Terraform provider.
#
# This is an EXCEPTION LIST, not a work queue. A group with no entry here is one we
# intend to expose, and scaffolding is generated for it automatically. Nothing waits
# on a human writing a line first.
#
# The flow:
#
#   1. The SDK exposes a group with no entry.
#   2. Scaffolding is generated for it — a resource, a data source, or both,
#      according to the CRUD shape derived from its method names.
#   3. A draft PR opens. Reviewing real generated code is where the keep-or-drop
#      decision actually gets made.
#   4. Merge it and the agent's entry lands in `implemented_by` — the group is
#      covered. Drop it and record why below, so it stops being regenerated.
#
# Derived automatically on every run, never stored here: each group's CRUD shape.
# So the shapes cannot rot against the SDK.
#
# CAVEAT: those shapes come from the SDK, which is generated from the API's OpenAPI
# spec. When the spec is incomplete the shape understates the real API — verified
# cases are noted below. Read a shape as a floor, not a ceiling.
#
# ## Fields
#
# implemented_by  Terraform type names this group backs. Non-empty means covered.
#                 There is no separate status field: two sources of truth for the
#                 same fact are free to contradict each other.
#
# ceiling         caps how much gets generated. Only on exclusions — "generate
#                 everything the shape supports" is expressed by having no entry.
#   none             generate nothing
#   datasource       a data source is fine, do not generate a resource
#
# rationale       why it is capped. Required whenever ceiling is set, and vice
#                 versa: a cap without a reason is unauditable, a reason without a
#                 cap does not say how much to stop.
#   api_constraint    the API does not offer enough to go further
#   product_decision  we do not want it, whatever the API offers
#   deprecated        the upstream endpoint is going away
#
# notes           context for whoever reviews this group next. Valid on its own —
#                 an entry with only notes still generates, it just arrives with the
#                 reviewer already warned.
#
# Why rationale matters: it decides whether an exclusion expires. An api_constraint
# is only true while the API stays put, so the report re-checks it every run and
# flags groups that have outgrown their ceiling. That flag never fails CI — an API
# that grew is an opportunity, and whoever bumps the SDK is not who decides product
# scope. A product_decision is exempt from the check entirely.
#
# ## The gate
#
# `TestProviderSDKCoverage` fails only on contradictions:
#   - an entry names a group the SDK no longer exposes (renamed or removed upstream)
#   - implemented_by names a Terraform type the provider does not register
#   - the provider registers a type no entry claims
#   - a ceiling without a rationale, or a rationale without a ceiling
#   - a covered group that still carries a ceiling or rationale
#
# A group with no entry is NOT a failure — that is the generation trigger.
#
# Regenerate the raw surface with: go run ./cmd/sdkcoverage groups
# Render the coverage table with:  make coverage-report

version: 1
sdk_module: github.com/latitudesh/latitudesh-go-sdk

groups:
  # ---------------------------------------------------------------- covered ---

  Billing:
    implemented_by: [latitudesh_billing]

  ElasticIps:
    implemented_by: [latitudesh_elastic_ip]

  Firewalls:
    implemented_by: [latitudesh_firewall, latitudesh_firewall_assignment]
    notes: >-
      Assignment methods are flattened onto this group (ListAssignments,
      DeleteAssignment) as well as living on Firewalls.Assignments.

  Firewalls.Assignments:
    implemented_by: [latitudesh_firewall_assignment]
    notes: >-
      Only Create lives here; the read and delete paths are on the parent group.
      v1.19.17 reshaped the Create response body (components.FirewallServer):
      id/type/attributes moved under a nested data envelope, attributes gained
      server/virtual_machine and dropped server_id, and FirewallServerType's
      enum value renamed firewall_servers -> firewall_assignments. None of it
      is mapped: the resource never reads the Create response body (it always
      re-derives the assignment ID via a follow-up ListAssignments call, see
      findAssignmentByTargetAndFirewall), so the reshape closes with a lock
      sync and no code change. Virtual-machine targets are wired up:
      operations.CreateFirewallAssignmentFirewallsAssignmentsAttributes.VirtualMachineID
      is exposed as the virtual_machine_id attribute (exactly one of
      server_id/virtual_machine_id, matching the API contract), and the
      read path maps the target from
      components.FirewallAssignmentDataAttributes.Server/.VirtualMachine.

  ManagedDatabases:
    implemented_by: [latitudesh_managed_database_metrics]
    notes: >-
      Data source. ShowManagedDatabaseMetrics is the only method on this
      group (crud shape -R--) and it is the one mapped: managed_database_id,
      period and queries drive the request, and from/to/metrics (a map keyed
      by metric name, each entry carrying unit/current/points) back the
      response. No methods are left unmapped.

  MarketplaceApps:
    implemented_by: [latitudesh_marketplace_app, latitudesh_marketplace_apps]
    notes: >-
      Data sources. Both methods are mapped: GetMarketplaceApp backs the
      singular `latitudesh_marketplace_app` id/slug lookups,
      ListMarketplaceApps backs both its name lookups and the plural
      `latitudesh_marketplace_apps` catalog listing (list + in-memory
      filter, since the list call takes no filter parameters and does not
      paginate). No methods are left unmapped. Both endpoints only return
      published apps and require the `marketplace_apps` feature to be
      enabled for the team, per the SDK doc comments — a team without that
      feature enabled or with the app unpublished will see 404s the same as
      a genuinely missing id/slug/name. Presentation-only catalog fields on
      MarketplaceAppDataAttributes are not exposed by team decision
      (2026-09-01) — description, short_description, access_instructions,
      upstream_url, documentation_url, logo_url, created_at serve catalog
      browsing, not provisioning; do not map them.

  Plans:
    implemented_by: [latitudesh_plan]
    notes: >-
      Data source. UpdateBandwidth is not wired up, hence the -RU- shape.
      GetBandwidth, GetManagedDatabasePlans and ListStorage are likewise
      unmapped — latitudesh_plan only calls Get and List. StoragePlanData
      (the model behind ListStorage) has no backing Terraform type at all.

      v1.19.19 drift closure (lock synced 2026-09-02): no mapping change.
      components.PlanDataAttributes.Regions (and, on the storage side,
      StoragePlanDataAttributes.Regions) has never been exposed by
      latitudesh_plan — the schema only surfaces slug/name/features/specs;
      regions, pricing and available_operating_systems are absent from both
      the schema and the Read mapping today, predating this drift. This PR
      continues that boundary rather than deciding it fresh.

      Deliberately left unmapped (all under the unmapped Regions surface):
      - components.PlanDataPricing.BRL/.USD (removed) and their backing
        components.PlanDataBRL/.PlanDataUSD models (removed): the currency
        struct fields are gone from the SDK, replaced by
        components.PlanDataPricing.hour/.month/.year (new *float64 fields).
      - components.PlanDataRegions.pricing: type changed from
        *PlanDataPricing to map[string]PlanDataPricing (now keyed by ISO
        4217 currency code per the updated SDK doc comment) — a shape change
        to a field this data source never read.
      - The identical BRL/USD -> flat-pricing shape change on the storage
        side: components.StoragePlanDataPricing.BRL/.USD (removed) and their
        components.StoragePlanDataBRL/.StoragePlanDataUSD models (removed),
        components.StoragePlanDataPricing.month (new), and
        components.StoragePlanDataRegions.pricing (type changed from
        *StoragePlanDataPricing to map[string]StoragePlanDataPricing).

      Reopen this if a future PR decides to expose plan/region pricing as a
      new attribute — see the handoff for the v1.19.19 drift PR for the
      reviewer flag.

  PrivateNetworks:
    implemented_by: [latitudesh_virtual_network, latitudesh_vlan_assignment]
    notes: >-
      Owns CRUD for virtual networks and the assignment lifecycle. Neither
      Terraform type is named private_network.

  Projects:
    implemented_by: [latitudesh_project]

  Regions:
    implemented_by: [latitudesh_region]
    notes: Data source. Reads a single region via Fetch, not Get.

  Roles:
    implemented_by: [latitudesh_role]

  SSHKeys:
    implemented_by: [latitudesh_ssh_key]
    notes: Ships as both a resource and a data source under the same type name.

  Servers:
    implemented_by: [latitudesh_server, latitudesh_server_reinstall, latitudesh_server_power]
    notes: >-
      Lock/Unlock/GetDeployConfig are folded into the resource's create and update
      paths rather than exposed separately. Reinstall is folded in too (an update
      that changes a reinstall-only field) and additionally exposed as the
      latitudesh_server_reinstall action, for reinstalling without changing
      desired state. RunAction is exposed as the latitudesh_server_power action
      (DX-144). The remaining operations (rescue mode, IPMI, out-of-band,
      scheduled deletion) are planned as further DX-144/DX-145 work.

      v1.19.17 drift closure (lock synced 2026-08-29): mapped
      components.ServerDataAttributes.legacy_network -> new Computed
      legacy_network and .features -> new Computed features (list) on
      latitudesh_server, both straightforward read-only refreshes.

      Deliberately left unmapped:
      - components.DeployConfigAttributes.ipxe_url: legacy field per team
        decision (2026-08-31) — not exposed as an attribute; the provider's
        ipxe input remains the supported iPXE path.
      - components.Credentials / components.ServerDataAttributes.credentials /
        components.ServerDataSSHKeys: "latest provisioning credentials,
        lazy loaded" per the SDK doc — only populated when the GET is called
        with extra_fields[servers]=credentials, which readServer never
        requests. Surfacing root passwords is a deliberate product decision
        (sensitive attribute, cache/rotation semantics), not a mechanical
        field mapping — flagged for the reviewer as a possible follow-up.
      - components.DeployConfigAttributes.ipxe (the raw script field): the
        resource's existing ipxe attribute is Optional-only (no Computed),
        so refreshing it from the deploy config would require flipping it
        to Optional+Computed — a schema/plan-modifier call this PR does not
        make. Flagged for the reviewer.
      - components.ServerDataFeatures.accelerate/rescue/workflow: these live
        on components.OperatingSystem.Features, a nested struct this
        provider has never mapped into any attribute (OS capability
        metadata, not server config); unaffected by this drift.
      - components.DeployConfig.meta / components.DeployConfigData.type /
        components.DeployConfigMeta / components.DeployConfigType: JSON:API
        envelope additions on the deploy-config GET response, no business
        data.
      - components.DeployConfigFilesystem "xfs" enum value removed /
        operations.UpdateServerDeployConfigServersFilesystem "xfs" removed:
        filesystem is API-managed and intentionally not in the disk_layout
        schema (see its MarkdownDescription), so no coercion site exists to
        update.
      - operations.UpdateServerDeployConfigServers* (RequestBody reshaped:
        attributes/type -> data; Attributes gained ipxe; Filesystem enum):
        Servers.UpdateDeployConfig is never called anywhere in this
        provider — disk_layout/ipxe/raid changes go through Servers.Reinstall
        instead — so the whole request-body reshape is dead surface for us.
      - operations.GetServersRequest.sort: no server list/data source exists
        to take a sort parameter.
      - operations.CreateServerServersAttributes.public_network /
        .public_network_id (new, both **Preview**, gated to teams with
        public networks enabled), plus the already-unmapped (pre-existing,
        only doc_changed here) components.ServerDataAttributes.public_network
        / components.ServerDataPublicNetwork read-back, and the matching
        doc_changed rows on CreateServerReinstallServersAttributes.public_network
        and UpdateServerDeployConfigServersAttributes.public_network(_id):
        attaching a server to a public network is a coherent small feature
        (create-time attribute(s) + a read-back nested object), but deciding
        its plan-modifier shape (does changing public_network_id force a
        replace, or does it go through Reinstall like disk_layout/ipxe?) is
        exactly the kind of API-behavior judgment this task defers to a
        human. Not built here; flagged for the reviewer as a candidate
        follow-up once someone can verify attach/detach semantics against
        the live API.
      - components.ServerDataAttributes.status doc_changed (now documented
        as an open set, not a closed enum) and the paired breaking
        field_type_changed (*ServerDataStatus -> *string): already handled
        correctly pre-drift — readServer and waitForServerStatus both do
        string(*attrs.Status) and compare status by plain string equality,
        never switching over the old named type, so both continue to
        compile and behave identically. No code change; verified by
        `go build`.

  Tags:
    implemented_by: [latitudesh_tag]
    notes: Also read by the server and virtual-network resources.

  TeamMembers:
    implemented_by: [latitudesh_member]

  Teams.Members:
    implemented_by: [latitudesh_member]
    notes: Supplies the read path for latitudesh_member via GetTeamMembers.

  UserData:
    implemented_by: [latitudesh_user_data]
    notes: Also read by the server resource to hash user-data content.

  VirtualMachines:
    implemented_by: [latitudesh_virtual_machine, latitudesh_virtual_machine_power]
    notes: >-
      Network attachments and metrics are not exposed. Note the update method is
      UpdateVirtualMachine, not Update. marketplace_app is exposed as a
      slug-only string attribute (mirroring how operating_system exposes only
      Slug); the nested name/version fields on
      VirtualMachineAttributesMarketplaceApp are deliberately not surfaced.
      CreateVirtualMachineAction is exposed as the latitudesh_virtual_machine_power
      action (DX-144).

  VirtualNetworks:
    implemented_by: [latitudesh_virtual_network]
    notes: >-
      Delete-only fragment — PrivateNetworks owns the rest of the lifecycle. The
      derived ---D shape is expected and is not a gap.

  # --------------------------------------------------------------- excluded ---

  BaselinesPreview:
    ceiling: none
    rationale: product_decision
    notes: >-
      Baselines is still under active development and its preview API is not
      stable, so scaffolding against it now would only churn. Revisit once the
      product ships.

  BlockStorage:
    ceiling: none
    rationale: product_decision
    notes: >-
      Volume creation is paused on the platform right now, so a scaffolded
      resource nobody can apply would only add review load. Revisit when creation
      reopens. Shape context for that day: methods are HTTP-verb prefixed
      (PostStorageVolumes, DeleteStorageVolumes), DeleteStorageVolumes deletes a
      single volume despite the plural, and the API has no volume update, so the
      CR-D shape is real and not a spec gap.

  FilesystemStorage:
    ceiling: none
    rationale: product_decision
    notes: >-
      Filesystem storage is gated — a customer has to request access before it
      can be created — so it is not a general Terraform surface yet. Revisit if it
      becomes generally available. Shape context: the API genuinely has no
      single-item read (confirmed against the routes), so import support would
      need thought — an API limitation, not a spec gap.

  IPAddresses:
    ceiling: none
    rationale: api_constraint
    notes: >-
      The /ips collection is not settled enough yet to model as a data source.
      Revisit on a later SDK bump.

  KubernetesClusters:
    ceiling: none
    rationale: deprecated
    notes: >-
      Managed Kubernetes is being deprecated, so we are not adding Terraform
      support for it. Shape context: kubeconfig retrieval and available-version
      listing would each likely want their own data source, and
      GET /kubernetes_clusters/plans exists in the API but is absent from the
      spec, so the SDK has no method for it.

  Projects.SSHKeys:
    ceiling: none
    rationale: deprecated
    notes: >-
      PostProjectSSHKey is marked Deprecated in the SDK, and the API route
      /projects/:project_id/ssh_keys is deprecated too. Project SSH keys are
      managed through the SSHKeys group instead.

  Teams:
    ceiling: none
    rationale: product_decision
    notes: >-
      Team management does not belong in Terraform, not even as a data source.
      (The API also has no DELETE and no show, so a resource could not be
      well-formed anyway — but the decision stands regardless of that.)

  VpnSessions:
    ceiling: none
    rationale: product_decision
    notes: >-
      A VPN session is ephemeral; Terraform state would be stale the moment after
      apply. Not a Terraform concern whatever the API offers.

  # ------------------------------------------------------------ annotations ---
  # No ceiling, so these still generate. The notes are here so whoever reviews the
  # generated PR starts with the context already gathered.

  ObjectStorage:
    implemented_by: [latitudesh_object_storage, latitudesh_object_storage_access_key]
    notes: >-
      The CR-D shape UNDERSTATES the API: PATCH /storage/buckets/:id is routed and
      implemented but missing from the spec, as are the lifecycle_rules
      sub-resource, a metrics endpoint, and a bucket-exists check. Scoped
      previously as PD-6063 and paused pending storage-team spec fixes. The
      generated resource lacks update support it could have had: every attribute
      is RequiresReplace. PostStorageBuckets/GetStorageBucket/GetStorageBuckets/
      DeleteStorageBuckets back latitudesh_object_storage (resource + data source).
      PostStorageAccessKeys/GetStorageAccessKeys/DeleteStorageAccessKeysUsername
      back latitudesh_object_storage_access_key (managed resource with optional
      pgp_key, plus an ephemeral resource sharing the create/delete calls).
      Unmapped: GetStorageBucketAccessKeys (per-bucket key listing, read-only);
      PostStorageBucketLifecycleRules,
      GetStorageBucketLifecycleRules, GetStorageBucketLifecycleRule,
      PatchStorageBucketLifecycleRule, DeleteStorageBucketLifecycleRule (the
      lifecycle_rules sub-resource, its own CRUD lifecycle keyed by bucket_id +
      rule id); GetStorageBucketMetrics and GetStorageUsage (read-only
      usage/metrics reporting, candidates for their own data sources later).

  VirtualMachineBackups:
    notes: >-
      VERIFY FIRST: the API checkout reviewed (2026-06-22) has backup domain code
      but no HTTP routes at all. The SDK exposing this group implies production does
      have the endpoints, but confirm before merging generated code against them.

  APIKeys:
    notes: >-
      Full CRUD, but managing API keys through Terraform means the key material
      lands in state — weigh that when reviewing.

  Traffic:
    notes: >-
      Read-only reporting. The API changes its response shape based on a project
      feature flag, so a data source needs to handle both.
