name: "Run go test"
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  # Run the acceptance suite deliberately: before a release, after a large
  # refactor, or to sweep tests the curated list below leaves out. There is no
  # scheduled run on purpose — the suite provisions real, billable infrastructure,
  # and on a branch nobody merged to it would cost money to learn nothing.
  workflow_dispatch:
    inputs:
      acceptance_tests:
        description: "Test name regex. Defaults to every acceptance test; narrow it to run a subset."
        required: false
        default: ""

env:
  # Every acceptance test runs. Using the prefix rather than a hand-maintained
  # allowlist means a newly added TestAcc* is covered automatically instead of
  # silently skipped until someone remembers to list it.
  ACCEPTANCE_TESTS: "TestAcc"

jobs:
  # Detect whether the PR touches code that can change provider behavior. Tooling
  # (cmd/, internal/sdkcoverage/) and docs cannot, so they must not trigger the
  # expensive e2e job, which provisions real infrastructure and serializes behind
  # other runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      # A skipped filter step leaves this empty, which defaults to "true": a manual
      # dispatch has no pull request to diff against, and should run the suite.
      provider: ${{ steps.filter.outputs.provider || 'true' }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Detect provider code changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            provider:
              - 'latitudesh/**/*.go'
              - 'internal/modifiers/**'
              - 'internal/planmodifiers/**'
              - 'internal/provider/**'
              - 'internal/validators/**'
              - 'main.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/test.yml'
              - '.github/workflows/e2e-comment.yml'

  build:
    runs-on: ubuntu-latest

    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read the toolchain from go.mod, the same way release.yml does. The old
          # '^1.23.0' floated to whatever Go was newest at run time, so CI compiled
          # with a different toolchain than the one releases ship with — and the
          # stdlib vulnerabilities a Go upgrade fixes were invisible here.
          go-version-file: 'go.mod'
      -
        # Not `go get .`: that resolves and upgrades the whole dependency graph,
        # rewriting go.mod and go.sum inside the runner. CI then built something
        # other than what the repository pins, and went green on states that fail a
        # plain `go build` — a bumped go.mod with a stale go.sum passed here twice.
        # `go mod download` fetches exactly what is committed, and -mod=readonly
        # below turns any remaining drift into a failure instead of a silent rewrite.
        name: Install dependencies
        run: go mod download
      -
        name: Build
        run: go build -v -mod=readonly ./...
      -
        # No -run filter on purpose. It used to be -run "TestProvider|TestFrameworkProvider",
        # which silently excluded every unit test whose name did not start with those two
        # prefixes, so new unit tests passed locally and never ran here. Acceptance tests
        # in this package all guard on TF_ACC and skip when it is unset, so running the
        # whole package needs no credentials.
        name: Run Unit Tests
        run: go test ./latitudesh -v -timeout 10m
      -
        name: Run Plan Modifier Tests
        run: go test ./internal/planmodifiers -v
      -
        # Neither step above covers this package: they name ./latitudesh and
        # ./internal/planmodifiers explicitly. Without its own step the SDK coverage
        # suite never runs.
        name: Run SDK Coverage Tests
        run: go test ./internal/sdkcoverage -v
      -
        # tfplugindocs exports the provider schema through a real Terraform binary.
        # Without one on PATH it downloads its own, and that download currently fails
        # signature verification (HashiCorp's release GPG key expired). Installing
        # Terraform here makes tfplugindocs use it instead of downloading.
        name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      -
        # docs/ is generated from templates/ plus the provider schema, so a hand-edit
        # to docs/ is silently lost on the next `go generate`. Nothing checked this
        # before, which is how the templates and the published docs drifted far enough
        # apart that the docs documented attributes the schema does not have. Editing
        # docs/ directly is the mistake this catches; change the template or the
        # schema description instead.
        name: Check generated docs are up to date
        run: |
          go generate ./...
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ is out of sync with templates/ and the provider schema."
            echo "Run 'go generate ./...' and commit the result."
            git diff --stat -- docs/
            exit 1
          fi
      -
        # examples/ is one loose Terraform module, and docs pages embed these
        # files verbatim via tffile. Nothing validated them against the real
        # schema before, which is how a block-syntax `timeouts {`, a duplicate
        # resource and two dangling references sat in published docs. Validating
        # with the provider built from this branch (via dev_overrides, no
        # `terraform init`) forces every example to match the schema the PR
        # actually ships.
        name: Validate examples against the built provider
        run: |
          go build -o "$RUNNER_TEMP/terraform-provider-latitudesh" .
          cat > "$RUNNER_TEMP/dev.tfrc" <<EOF
          provider_installation {
            dev_overrides {
              "latitudesh/latitudesh" = "$RUNNER_TEMP"
            }
            direct {}
          }
          EOF
          terraform fmt -check -recursive examples/
          cd examples
          TF_CLI_CONFIG_FILE="$RUNNER_TEMP/dev.tfrc" terraform validate

  e2e:
    runs-on: ubuntu-latest
    needs: [build, changes]
    # Draft pull requests are excluded deliberately, and not just to save time:
    # acceptance tests run against the live API (the recorder defaults to
    # passthrough and CI never sets LATITUDE_TEST_RECORDER), so a draft carrying
    # unreviewed or generated Terraform would provision real infrastructure before
    # anyone had looked at it. Marking the PR ready for review triggers this job.
    #
    # The `skip-e2e` label opts a PR out of the suite: a maintainer adds it when
    # the change cannot affect provisioning in a way the paths filter can't see
    # (or on a work-in-progress that should not burn billable infrastructure yet),
    # and the suite is skipped on every push while the label stays on. This would
    # once have been a trap — removing a label does not re-trigger a run, so a PR
    # could sit skipped with no way back short of an empty commit. The `/run-e2e`
    # comment trigger (see e2e-comment.yml) closes that gap: it runs the suite on
    # demand regardless of the label, so opting out is always reversible.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (needs.changes.outputs.provider == 'true' &&
       github.event.pull_request.draft == false &&
       !contains(github.event.pull_request.labels.*.name, 'skip-e2e'))
    # The acceptance suite runs against one shared Latitude account/project, so
    # two runs in flight at once would create colliding resource names.
    # Serialize them: a new run queues until the previous finishes (never
    # cancels it mid-run, which would leak half-created resources).
    concurrency:
      group: latitudesh-acceptance-tests
      cancel-in-progress: false
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      -
        name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      -
        # See the build job: `go get .` would upgrade the dependency graph rather
        # than install what go.mod and go.sum pin.
        name: Install dependencies
        run: go mod download
      -
        name: Run E2E Tests
        # The test selector goes through the environment rather than being
        # interpolated into the command. Expression interpolation happens before the
        # shell parses this script, so a dispatch input spliced in directly would let
        # anyone who can dispatch run arbitrary commands — in the one step that has
        # LATITUDESH_AUTH_TOKEN in its environment. Quoted "$ACCEPTANCE_TESTS" is
        # only ever an argument.
        #
        # The timeout is deliberately far above how long the suite takes: go test
        # enforces -timeout by killing the binary, so destroy steps and the shared
        # fixture teardown never run and the cap leaks billable servers instead of
        # just failing the run.
        run: go test ./latitudesh -v -timeout 180m -run "$ACCEPTANCE_TESTS"
        env:
          ACCEPTANCE_TESTS: ${{ github.event.inputs.acceptance_tests || env.ACCEPTANCE_TESTS }}
          TF_ACC: '1'
          LATITUDESH_AUTH_TOKEN: ${{ secrets.LATITUDESH_AUTH_TOKEN }}
