name: "SDK coverage watch"

# The auto-scaffolding pipeline: on a weekly cadence (or on demand), reconcile
# the *latest* published latitudesh-go-sdk against what this provider ships,
# keep a single tracking issue up to date with the groups that have no coverage
# yet, and turn the top pending group into a draft PR through the scaffolding
# agent. Detection is the $0 path and stays that way by construction: the
# Anthropic key exists only in the scaffold job, which is skipped entirely when
# there is nothing to scaffold.
on:
  # Weekly is enough: a new SDK service group is rare (2 in 29 releases), and the
  # acceptance criterion is a delta surfaced within 7 days.
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      group:
        description: "Single SDK group to scaffold, overriding top-of-queue selection (ignored by detection). Also the retry channel for a parked group."
        required: false
        default: ""
      dry_run:
        description: "Render the tracking issue to the run summary without creating or editing anything, and skip the scaffold job."
        required: false
        type: boolean
        default: false
  # Inert until the SDK repository is wired to send this event (a later PR). It is
  # declared now so turning it on there is a one-line change in the SDK repo, not
  # an edit to this workflow.
  repository_dispatch:
    types: [sdk-release]

# Read-only by default. The one job that needs to write issues elevates its own
# permissions; keeping the default minimal means a new job cannot quietly gain
# write access.
permissions:
  contents: read

# Never run two of these at once (a manual dispatch on top of the cron), so the
# tracking issue is not upserted twice concurrently. Do not cancel a run in
# flight — a half-finished issue edit is worse than waiting.
concurrency:
  group: sdk-scaffold
  cancel-in-progress: false

jobs:
  # Reconcile the latest SDK against the provider and emit the coverage report as
  # JSON. No API token, no Anthropic key: this analyzes source in the module cache.
  detect:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.report.outputs.pending }}
      pinned: ${{ steps.resolve.outputs.pinned }}
      latest: ${{ steps.resolve.outputs.latest }}
      pinned_check_ok: ${{ steps.pinned_check.outputs.ok }}
    steps:
      # Every action here is pinned to an immutable commit SHA: this workflow's
      # sibling job writes issues, so a mutable tag would let reviewed action code
      # change underneath us without any change to this repository.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Track go.mod rather than a floating range, so every workflow resolves
          # the same toolchain as the release build.
          go-version-file: "go.mod"

      - name: Resolve pinned and latest SDK versions
        id: resolve
        env:
          SDK_MODULE: github.com/latitudesh/latitudesh-go-sdk
        run: |
          set -euo pipefail
          pinned=$(go list -m -f '{{.Version}}' "$SDK_MODULE")
          latest=$(go list -m -versions -json "$SDK_MODULE" | jq -r '.Versions[-1] // empty')
          if [ -z "$latest" ]; then
            echo "::error::could not resolve the latest version of $SDK_MODULE"
            exit 1
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Pinned $pinned, latest $latest"

      - name: Report coverage against the latest SDK
        id: report
        env:
          SDK_MODULE: github.com/latitudesh/latitudesh-go-sdk
          LATEST: ${{ steps.resolve.outputs.latest }}
        run: |
          set -euo pipefail
          # Parse the latest SDK straight from the module cache. This never edits
          # go.mod: the provider is still built against the pinned SDK, and only
          # the surface parser reads the newer source via -sdk-dir. That is how a
          # new group is detected without committing to the bump.
          dir=$(go mod download -json "$SDK_MODULE@$LATEST" | jq -r '.Dir')
          if [ -z "$dir" ] || [ "$dir" = "null" ]; then
            echo "::error::could not download $SDK_MODULE@$LATEST"
            exit 1
          fi
          go run ./cmd/sdkcoverage report -format json -sdk-dir "$dir" > report.json
          pending=$(jq -r '.counts.pending' report.json)
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          echo "$pending group(s) pending against $LATEST"

      - name: Check the pinned SDK for contradictions
        id: pinned_check
        # Advisory here, not fatal: a contradiction on the pinned SDK is already a
        # unit-test failure on every PR, so failing this job would only suppress
        # the tracking issue the run exists to publish. Surface it in the issue
        # instead. (main has no required checks, so this weekly pass is a genuine
        # backstop.)
        continue-on-error: true
        run: |
          set -uo pipefail
          if go run ./cmd/sdkcoverage check > pinned_check.txt 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::pinned SDK has coverage contradictions; see the tracking issue"
          fi
          cat pinned_check.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-coverage-report
          path: |
            report.json
            pinned_check.txt
          retention-days: 14
          # v4 artifacts are immutable per run (not per attempt): without this,
          # "Re-run all jobs" hits a 409 on the attempt-1 artifact and the retry
          # dies before reaching whatever actually failed.
          overwrite: true

  # Upsert one fixed tracking issue from the report. Separated from detect so the
  # write-scoped token lives only where issues are actually edited.
  issue:
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      # This job never checks out the repo, so gh has no git remote to infer the
      # repository from — without GH_REPO every gh call below fails.
      GH_REPO: ${{ github.repository }}
      TRACKING_LABEL: sdk-coverage
      MARKER: "<!-- sdk-coverage-tracking -->"
      PENDING: ${{ needs.detect.outputs.pending }}
      PINNED: ${{ needs.detect.outputs.pinned }}
      LATEST: ${{ needs.detect.outputs.latest }}
      PINNED_CHECK_OK: ${{ needs.detect.outputs.pinned_check_ok }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-coverage-report

      - name: Build the issue body
        run: |
          set -euo pipefail
          {
            echo "$MARKER"
            echo "# SDK coverage: ${PENDING} group(s) pending generation"
            echo
            echo "_Generated by \`.github/workflows/sdk-watch.yml\`. Edits are overwritten on the next run._"
            echo
            echo "Pinned SDK: \`${PINNED}\`. Latest published: \`${LATEST}\`."
            echo
            counts=$(jq -r '.counts | "\(.covered) of \(.total) service groups covered — \(.pending) pending, \(.excluded) excluded, \(.unshaped) too partial to generate."' report.json)
            echo "$counts"

            if [ "${PINNED_CHECK_OK}" = "false" ]; then
              echo
              echo "> [!WARNING]"
              echo "> The pinned SDK (\`${PINNED}\`) has coverage contradictions. This normally fails a PR's unit tests; seeing it here means something reached \`main\` unchecked. Fix \`sdk-coverage.yaml\` and/or the provider registration."
            fi

            # Violations against the LATEST SDK never fail a PR (nothing pins that
            # version yet), so this issue is the only place they surface. Ignoring
            # them would present a renamed or removed group as ordinary pending work.
            latest_violations=$(jq -r '.counts.violations' report.json)
            if [ "$latest_violations" -gt 0 ]; then
              echo
              echo "> [!WARNING]"
              echo "> Reconciling the latest SDK (\`${LATEST}\`) reports ${latest_violations} violation(s) — usually a group renamed or removed upstream. The pending list below may be incomplete or mislabeled until \`sdk-coverage.yaml\` catches up:"
              echo
              jq -r '.violations[] | "> - " + (if (.group // "") != "" then "`" + .group + "`: " else "" end) + .message' report.json
            fi

            echo
            echo "## Pending generation"
            echo
            if [ "${PENDING}" -eq 0 ]; then
              echo "None — every SDK service group is either covered or explicitly excluded. 🎉"
            else
              echo "Each group below is exposed by latitudesh-go-sdk but not by this provider. Scaffolding produces a resource, a data source, or both, per the derived CRUD shape. Reviewing that generated PR is where the keep-or-drop call is made; to drop one, record a \`ceiling\` + \`rationale\` for its group in \`sdk-coverage.yaml\`."
              echo
              jq -r '
                .pending[]
                | "- [ ] `\(.group)` → `\(.suggested_type_name)` — `\(.crud)`, generates \(.generates | join(" + "))"
                  + (if (.notes // "") != "" then "\n  - " + (.notes | gsub("\\s+";" ") | ltrimstr(" ")) else "" end)
              ' report.json
            fi

            revisit=$(jq -r '.counts.revisit' report.json)
            if [ "$revisit" -gt 0 ]; then
              echo
              echo "## Worth revisiting"
              echo
              echo "Excluded on API grounds, but the SDK has since grown past the recorded ceiling. Not urgent — re-triage when convenient."
              echo
              jq -r '.revisit[] | "- `\(.group)` — recorded ceiling `\(.ceiling)`, now `\(.crud)`"' report.json
            fi

            echo
            echo "## Open scaffold PRs"
            echo
            # A failed listing must not read as "None open." — that would claim a
            # clean slate exactly when we know nothing.
            if prs=$(gh pr list --label scaffold --state open --json number,title,url --jq '.[] | "- #\(.number) [\(.title)](\(.url))"'); then
              if [ -n "$prs" ]; then
                echo "$prs"
              else
                echo "None open."
              fi
            else
              echo "_Could not list scaffold PRs — check the workflow run log._"
            fi

            echo
            echo "## Housekeeping"
            echo
            echo "A scaffold PR closed without merging is parked until \`sdk-coverage.yaml\` records a \`ceiling\` + \`rationale\` for its group — otherwise the next run just regenerates it."
          } > body.md

          echo "----- issue body -----"
          cat body.md
          echo "----------------------"

      - name: Render only (dry run)
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          {
            echo "## Dry run — tracking issue not modified"
            echo
            cat body.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure the tracking label exists
        if: env.DRY_RUN != 'true'
        run: |
          gh label create "$TRACKING_LABEL" \
            --color 0e8a16 \
            --description "Auto-scaffolding: SDK groups the provider does not yet cover" \
            2>/dev/null || true

      - name: Upsert the tracking issue
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          # Oldest marker-carrying issue wins: gh returns newest-first, so taking
          # .[0] as-is would let any newer labeled issue displace the long-lived
          # tracker and fragment its history.
          existing=$(gh issue list --label "$TRACKING_LABEL" --state open --limit 100 \
            --json number,body --jq \
            "map(select(.body | contains(\"$MARKER\"))) | sort_by(.number) | .[0].number // empty")

          title="SDK coverage: ${PENDING} group(s) pending generation"
          violations=$(jq -r '.counts.violations' report.json)
          if [ "$violations" -gt 0 ]; then
            title="SDK coverage: ${PENDING} pending, ${violations} violation(s) against ${LATEST}"
          fi
          if [ "${PINNED_CHECK_OK}" != "true" ]; then
            title="${title} — pinned SDK check failing"
          fi

          # Close only when there is truly nothing to report: zero pending, a
          # clean latest reconcile, AND a passing pinned check. The pinned check
          # is this run's backstop — main has no required status checks, so a
          # contradiction that reached it unchecked surfaces nowhere else; closing
          # over it would bury the one warning this workflow exists to keep
          # visible. Anything but an explicit "true" (including an empty output
          # from a broken step) keeps the issue open.
          if [ "${PENDING}" -eq 0 ] && [ "$violations" -eq 0 ] && [ "${PINNED_CHECK_OK}" = "true" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "All SDK service groups are now covered or excluded as of \`${LATEST}\`. Closing; a future run opens a fresh tracking issue if a coverage gap reappears."
              gh issue close "$existing"
              echo "Closed tracking issue #$existing"
            else
              echo "Nothing pending and no open tracking issue — done."
            fi
            exit 0
          fi

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$title" --body-file body.md
            echo "Updated tracking issue #$existing"
          else
            gh issue create --title "$title" --label "$TRACKING_LABEL" --body-file body.md
            echo "Created a new tracking issue"
          fi

  # Turn ONE pending group into a draft PR. One group per run keeps prompts
  # small, failures attributable, and manifest/provider.go conflicts between
  # sibling scaffold PRs structurally rare; the open-PR cap keeps the reviewer's
  # plate full without flooding. This is the only job that can see the Anthropic
  # key, and it never runs on an empty queue — the $0-on-no-delta guarantee is
  # structural, not behavioral.
  scaffold:
    needs: detect
    # Real work only, on a sane pinned manifest, never on a dry run. A
    # contradicted manifest means the coverage ledger is lying, and scaffolding
    # on top of it risks double-implementing a group.
    if: >-
      github.event.inputs.dry_run != 'true' &&
      needs.detect.outputs.pending != '0' &&
      needs.detect.outputs.pinned_check_ok == 'true'
    runs-on: ubuntu-latest
    # 60, not 45: the agent step alone may take its full 30 and the Go
    # builds/gate around it are not free. A job-level timeout is a cancellation,
    # which skips every failure() handler — it must stay slack, the step
    # timeouts are the real budget.
    timeout-minutes: 60
    permissions:
      contents: read
      # Dedupe reads PR labels with the default token. Pushing, opening the PR,
      # and labeling it use the GitHub App token instead — a PR created with the
      # default GITHUB_TOKEN would never trigger test.yml (so the draft would sit
      # with no checks), and `gh pr edit --add-label` is a PR mutation the
      # read-scoped default token cannot perform.
      pull-requests: read
      issues: write
    env:
      # Deliberately NOT job-level GH_TOKEN: the agent step inherits job env, and
      # the allowlisted go commands compile and run code the agent just wrote —
      # handing that step a GitHub token would gift-wrap it for exfiltration.
      # Steps that call gh set GH_TOKEN in their own env instead.
      GH_REPO: ${{ github.repository }}
      SDK_MODULE: github.com/latitudesh/latitudesh-go-sdk
      LATEST: ${{ needs.detect.outputs.latest }}
      MAX_OPEN_SCAFFOLD_PRS: "2"
      # Model policy (DX-23): claude-sonnet-5 default; escalate to opus manually
      # (workflow_dispatch after a failed run) when a delta is structurally
      # ambiguous.
      SCAFFOLD_MODEL: claude-sonnet-5
      # Keep in sync with MAX_TURNS in scripts/eval-scaffold.sh — the eval only
      # predicts production while both grant the same budget. The cap is runaway
      # protection, not a target: measured runs gate-greened by ~50-80 turns and
      # the agent polishes until killed, so 200 makes truncation rare while the
      # handoff file makes it harmless. The cost step warns above $6.
      SCAFFOLD_MAX_TURNS: "200"
      GIT_BOT_NAME: "latitudesh-sdk-watch[bot]"
      GIT_BOT_EMAIL: "latitudesh-sdk-watch[bot]@users.noreply.github.com"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Without this, checkout persists the default token as an
          # http.extraheader in .git/config, which silently OVERRIDES the app
          # token embedded in the push URL below — the push would run with the
          # read-only default token and fail. It would also sit readable in the
          # workspace during the agent step.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: "go.mod"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          # The gate validates the scaffolded example standalone with a plain
          # `terraform validate`; the wrapper shim would capture its stdout into
          # step outputs and get in the way of that direct CLI usage.
          terraform_wrapper: false

      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-coverage-report
          # NEVER into the workspace: report.json/pinned_check.txt would sit
          # there as untracked files, and the gate's diff-scope check (which
          # scans untracked files too) would fail every single run — after the
          # agent spend, and unfixably, since the agent cannot delete files.
          path: ${{ runner.temp }}/sdk-coverage

      # A scaffold PR that is OPEN but still DRAFT at the start of a run is an
      # orphan: runs are serialized by the concurrency group, and a live
      # finalize only holds a draft for the seconds between create and ready.
      # Its tree passed the gate and its body was written by the attempt that
      # pushed it — finishing its lifecycle is just marking it ready. Without
      # this, a run that died between labeling and `gh pr ready` would strand
      # the PR in draft forever: the select step below sees the group as
      # claimed and never routes back to it.
      - name: Find orphaned scaffold drafts
        id: orphans
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          numbers=$(gh pr list --label scaffold --state open --json number,isDraft \
            --jq '[.[] | select(.isDraft) | .number] | map(tostring) | join(" ")')
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"
          if [ -n "$numbers" ]; then
            echo "::notice::orphaned draft scaffold PR(s) to adopt: $numbers"
          else
            echo "no orphaned drafts"
          fi

      - name: Mint a token to adopt orphans
        id: adopt_app
        if: steps.orphans.outputs.numbers != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SDK_WATCH_CLIENT_ID }}
          private-key: ${{ secrets.SDK_WATCH_APP_PRIVATE_KEY }}

      - name: Adopt orphaned scaffold drafts
        if: steps.orphans.outputs.numbers != ''
        env:
          # The app token, not the default one: a ready_for_review event fired
          # by the default GITHUB_TOKEN would not trigger test.yml, and the
          # adopted PR would sit ready with no checks.
          GH_TOKEN: ${{ steps.adopt_app.outputs.token }}
          NUMBERS: ${{ steps.orphans.outputs.numbers }}
        run: |
          set -euo pipefail
          for n in $NUMBERS; do
            gh pr ready "$n"
            echo "adopted scaffold PR #$n — marked ready for review"
          done

      - name: Select the group to scaffold
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ github.event.inputs.group }}
        run: |
          set -euo pipefail
          # Groups already claimed by an open scaffold PR are never re-picked
          # (any claimed PR still in draft was adopted — marked ready — by the
          # step above before this list is taken); groups whose scaffold PR
          # closed without merging are parked until sdk-coverage.yaml records a
          # ceiling+rationale for them (or a human retries explicitly via the
          # `group` input, which is the whole point of letting the override
          # bypass the parked list — but never an open claim, which would
          # double-scaffold).
          claimed=$(gh pr list --label scaffold --state open --json labels \
            --jq '[.[].labels[].name | select(startswith("scaffold:")) | ltrimstr("scaffold:")] | unique | .[]')
          parked=$(gh pr list --label scaffold --state closed --limit 100 --json labels,mergedAt \
            --jq '[.[] | select(.mergedAt == null) | .labels[].name | select(startswith("scaffold:")) | ltrimstr("scaffold:")] | unique | .[]')

          report="$RUNNER_TEMP/sdk-coverage/report.json"
          pick=""
          if [ -n "$OVERRIDE" ]; then
            if ! jq -e --arg g "$OVERRIDE" '.pending[] | select(.group==$g)' "$report" >/dev/null; then
              echo "::error::requested group '$OVERRIDE' is not in the pending queue against $LATEST"
              exit 1
            fi
            if printf '%s\n' "$claimed" | grep -Fxq "$OVERRIDE"; then
              echo "::error::an open scaffold PR already claims '$OVERRIDE' — close it before re-running"
              exit 1
            fi
            pick="$OVERRIDE"
          else
            open_count=$(gh pr list --label scaffold --state open --json number --jq 'length')
            if [ "$open_count" -ge "$MAX_OPEN_SCAFFOLD_PRS" ]; then
              echo "has_work=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$open_count scaffold PR(s) already open (cap $MAX_OPEN_SCAFFOLD_PRS) — not scaffolding this run"
              exit 0
            fi
            while read -r g; do
              printf '%s\n' "$claimed" | grep -Fxq "$g" && continue
              printf '%s\n' "$parked" | grep -Fxq "$g" && continue
              pick="$g"
              break
            done < <(jq -r '.pending[].group' "$report")
          fi

          if [ -z "$pick" ]; then
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "::notice::every pending group is claimed or parked — nothing to scaffold"
            exit 0
          fi
          echo "has_work=true" >> "$GITHUB_OUTPUT"
          echo "group=$pick" >> "$GITHUB_OUTPUT"
          echo "Selected: $pick"

      - name: Bump the SDK when the pinned surface lacks the group
        if: steps.select.outputs.has_work == 'true'
        env:
          GROUP: ${{ steps.select.outputs.group }}
        run: |
          set -euo pipefail
          # Capture first, test second: piping `go run` straight into `jq -e`
          # would read a crashed report as "group not pending" and bump on top
          # of a broken tool.
          pinned_report=$(go run ./cmd/sdkcoverage report -format json)
          if echo "$pinned_report" | jq -e --arg g "$GROUP" '.pending[] | select(.group==$g)' >/dev/null; then
            echo "pinned SDK already exposes $GROUP — no bump needed"
            exit 0
          fi
          # The group only exists in the newer SDK. The bump belongs in the
          # scaffold branch, reviewed together with the code that needs it; the
          # agent itself is forbidden from touching go.mod, so the workflow
          # commits the bump first and the gate diffs the agent's work against
          # that commit.
          echo "pinned SDK lacks $GROUP — bumping to $LATEST"
          go get "$SDK_MODULE@$LATEST"
          go mod tidy
          # A bump that breaks the build is human work, not agent work: stop
          # before spending a single token.
          go build ./...
          git -c user.name="$GIT_BOT_NAME" -c user.email="$GIT_BOT_EMAIL" \
            commit -m "chore(deps): bump latitudesh-go-sdk to $LATEST" -- go.mod go.sum

      - name: Render the scaffold prompt
        id: render
        if: steps.select.outputs.has_work == 'true'
        env:
          GROUP: ${{ steps.select.outputs.group }}
        run: |
          set -euo pipefail
          report=$(go run ./cmd/sdkcoverage report -format json)
          group_json=$(echo "$report" | jq -c --arg g "$GROUP" '.pending[] | select(.group==$g)')
          if [ -z "$group_json" ]; then
            echo "::error::$GROUP is still not pending against the pinned SDK after the bump step"
            exit 1
          fi
          TF_NAME=$(echo "$group_json" | jq -r '.suggested_type_name')
          KINDS=$(echo "$group_json" | jq -r '.generates | join(", ")')
          METHODS=$(echo "$group_json" | jq -r '.methods | join(", ")')
          NOTES=$(echo "$group_json" | jq -r 'if (.notes // "") == "" then "none" else (.notes | gsub("\\s+";" ")) end')
          SDK_VERSION=$(echo "$report" | jq -r '.sdk_version')

          # A stale handoff from a previous process must never masquerade as this
          # run's — the PR-body fallback reads this exact path.
          rm -f /tmp/scaffold-handoff.md

          GROUP="$GROUP" KINDS="$KINDS" TF_NAME="$TF_NAME" METHODS="$METHODS" \
            NOTES="$NOTES" SDK_VERSION="$SDK_VERSION" MAX_TURNS="$SCAFFOLD_MAX_TURNS" \
            scripts/render-scaffold-prompt.sh > /tmp/scaffold-prompt.md

          {
            echo "prompt<<SCAFFOLD_PROMPT_EOF"
            cat /tmp/scaffold-prompt.md
            echo "SCAFFOLD_PROMPT_EOF"
            echo "tf_name=$TF_NAME"
            echo "kinds=$KINDS"
            echo "methods=$METHODS"
            echo "crud=$(echo "$group_json" | jq -r '.crud')"
            echo "sdk_version=$SDK_VERSION"
            echo "covered_before=$(echo "$report" | jq -r '.counts.covered')"
            echo "pending_before=$(echo "$report" | jq -r '.counts.pending')"
            echo "total_groups=$(echo "$report" | jq -r '.counts.total')"
            echo "notes<<SCAFFOLD_NOTES_EOF"
            echo "$NOTES"
            echo "SCAFFOLD_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run the scaffolding agent
        id: agent
        if: steps.select.outputs.has_work == 'true'
        timeout-minutes: 30
        # The gate below is the arbiter, not the agent's exit code: an agent
        # that hits the turn cap after finishing the tree (measured: it happens)
        # should still ship its draft, and an agent that died early leaves a
        # tree the gate fails on its own.
        continue-on-error: true
        uses: anthropics/claude-code-action@70fec183852c4f82f3f1969faed7dd60c5149ca7 # v1.0.207
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Without an explicit token the action's prepare phase falls back to a
          # GitHub OIDC exchange that needs `id-token: write` plus the Claude
          # GitHub App, and fails at startup before a single Claude turn. The
          # deliberately read-scoped default token is enough: agent mode on
          # schedule/workflow_dispatch performs no comment or branch writes.
          github_token: ${{ github.token }}
          prompt: ${{ steps.render.outputs.prompt }}
          # The allowlist mirrors scripts/eval-scaffold.sh exactly — the eval is
          # only evidence about production if both grant the same tools. No gh,
          # no git writes, no network, no free shell: commits and the PR are made
          # by the deterministic steps below, never by the agent.
          claude_args: >-
            --model ${{ env.SCAFFOLD_MODEL }}
            --max-turns ${{ env.SCAFFOLD_MAX_TURNS }}
            --allowedTools "Read,Glob,Grep,Edit,Write,MultiEdit,Bash(go build:*),Bash(go vet:*),Bash(go test:*),Bash(go doc:*),Bash(gofmt:*),Bash(go generate:*),Bash(go run ./cmd/sdkcoverage:*),Bash(jq:*),Bash(scripts/scaffold-validate.sh:*)"

      # Cost and agent stats live HERE, in the run summary — deliberately not in
      # the PR body, which is the reviewer's surface, not the operator's.
      - name: Report agent cost and stats
        id: cost
        if: always() && steps.agent.outcome != 'skipped' && steps.agent.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.agent.outputs.execution_file }}
          GROUP: ${{ steps.select.outputs.group }}
        run: |
          set -uo pipefail
          # The execution file is either a single result object or an array of
          # transcript records whose last "result" entry carries the totals.
          cost=$(jq -r 'if type=="array" then (map(select(.type? == "result")) | last | .total_cost_usd // empty) else (.total_cost_usd // empty) end' "$EXEC_FILE" 2>/dev/null || true)
          turns=$(jq -r 'if type=="array" then (map(select(.type? == "result")) | last | .num_turns // empty) else (.num_turns // empty) end' "$EXEC_FILE" 2>/dev/null || true)
          cost=${cost:-unknown}
          turns=${turns:-unknown}
          echo "cost=$cost" >> "$GITHUB_OUTPUT"
          echo "turns=$turns" >> "$GITHUB_OUTPUT"

          cost_fmt="$cost"
          if [ "$cost" != "unknown" ]; then
            cost_fmt=$(printf '%.2f' "$cost")
          fi
          prompt_version=$(sed -n 's/^prompt-version: *//p' .github/prompts/scaffold-resource.md | head -1)
          if [ -f /tmp/scaffold-handoff.md ]; then
            handoff="present ($(wc -c < /tmp/scaffold-handoff.md | tr -d ' ') bytes)"
          else
            handoff="MISSING"
          fi
          {
            echo "## Scaffold agent"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Group | \`$GROUP\` |"
            echo "| Model | \`$SCAFFOLD_MODEL\` |"
            echo "| Prompt | v${prompt_version:-?} |"
            echo "| Turns | ${turns} (cap $SCAFFOLD_MAX_TURNS) |"
            echo "| Cost | \$${cost_fmt} |"
            echo "| Handoff file | $handoff |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$cost" != "unknown" ] && awk "BEGIN { exit !($cost > 6) }"; then
            echo "::warning::agent run cost \$${cost_fmt} — above the \$6 watermark, review the transcript for thrash"
          fi

      - name: Validate the scaffold
        if: steps.select.outputs.has_work == 'true'
        env:
          GROUP: ${{ steps.select.outputs.group }}
          TF_NAME: ${{ steps.render.outputs.tf_name }}
          KINDS: ${{ steps.render.outputs.kinds }}
        run: |
          set -euo pipefail
          bash scripts/scaffold-validate.sh --group "$GROUP" --type-name "$TF_NAME" --kinds "$KINDS" --base HEAD

      - name: Mint the installation token
        id: app
        if: steps.select.outputs.has_work == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SDK_WATCH_CLIENT_ID }}
          private-key: ${{ secrets.SDK_WATCH_APP_PRIVATE_KEY }}

      - name: Push the branch and open the PR
        if: steps.select.outputs.has_work == 'true'
        env:
          GROUP: ${{ steps.select.outputs.group }}
          TF_NAME: ${{ steps.render.outputs.tf_name }}
          KINDS: ${{ steps.render.outputs.kinds }}
          METHODS: ${{ steps.render.outputs.methods }}
          CRUD: ${{ steps.render.outputs.crud }}
          SDK_VERSION: ${{ steps.render.outputs.sdk_version }}
          COVERED_BEFORE: ${{ steps.render.outputs.covered_before }}
          PENDING_BEFORE: ${{ steps.render.outputs.pending_before }}
          TOTAL_GROUPS: ${{ steps.render.outputs.total_groups }}
          NOTES: ${{ steps.render.outputs.notes }}
          EXEC_FILE: ${{ steps.agent.outputs.execution_file }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          short="${TF_NAME#latitudesh_}"
          branch="scaffold/${short}-${{ github.run_id }}"

          # The finalize sequence (push → create → label → ready) must be
          # RERUNNABLE: an attempt can die between any two of these calls, a
          # rerun keeps the same run_id (same branch name) but regenerates a
          # different tree, and this repo never force-pushes. Whatever happens,
          # the PR body must describe the commit under review:
          #   - branch AND its PR exist → reuse both, body untouched — the body
          #     written by the attempt that pushed the branch describes that
          #     tree; overwriting it with this attempt's metadata (handoff, SDK
          #     version) would describe a tree nobody is reviewing;
          #   - branch exists with NO PR → nobody references it; delete the
          #     orphan ref and push this attempt's tree, so body and commit
          #     match by construction;
          #   - neither exists → the ordinary path.
          reuse_pr=""
          if git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null 2>&1; then
            reuse_pr=$(GH_TOKEN="${{ github.token }}" gh pr list --state open --head "$branch" \
              --json url --jq '.[0].url // empty')
            if [ -n "$reuse_pr" ]; then
              echo "branch ${branch} and its PR survive from a previous attempt — finishing their lifecycle"
            else
              echo "branch ${branch} is an orphan with no PR — replacing it with this attempt's tree"
              git push "https://x-access-token:${APP_TOKEN}@github.com/${GH_REPO}.git" --delete "refs/heads/${branch}"
            fi
          fi
          if [ -z "$reuse_pr" ]; then
            # Commit by explicit pathspec — the gate already proved the diff is
            # in scope, and adding by name means a stray file could not ride
            # along even if it were not.
            git -c user.name="$GIT_BOT_NAME" -c user.email="$GIT_BOT_EMAIL" \
              add -- latitudesh sdk-coverage.yaml templates examples docs
            git -c user.name="$GIT_BOT_NAME" -c user.email="$GIT_BOT_EMAIL" \
              commit -m "feat(${short}): scaffold ${TF_NAME} from SDK group ${GROUP}"
            git push "https://x-access-token:${APP_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/${branch}"
          fi

          prompt_version=$(sed -n 's/^prompt-version: *//p' .github/prompts/scaffold-resource.md | head -1)
          # The handoff is agent-authored free text going into a PR body — cap it
          # so a runaway or adversarial block cannot balloon the PR description.
          # It is written via --body-file, never through a shell eval. A
          # turn-capped session emits no final message, so fall back to the
          # handoff FILE the prompt has the agent maintain from its first draft.
          handoff=$(jq -r 'if type=="array" then (map(select(.type? == "result")) | last | .result // "") else (.result // "") end' "$EXEC_FILE" 2>/dev/null | awk '/^## Handoff/{found=1} found' | head -c 8000 || true)
          if [ -z "$handoff" ] && [ -f /tmp/scaffold-handoff.md ]; then
            handoff=$(head -c 8000 /tmp/scaffold-handoff.md)
          fi
          if [ -z "$handoff" ]; then
            handoff="_The agent did not emit a handoff block — read the transcript in the run artifacts before reviewing._"
          fi

          # The tree now carries the scaffold, so a fresh report gives the
          # after-merge coverage numbers for the summary.
          after=$(go run ./cmd/sdkcoverage report -format json)
          covered_after=$(echo "$after" | jq -r '.counts.covered')
          pending_after=$(echo "$after" | jq -r '.counts.pending')

          # Speakeasy-style version suggestion. A new resource/data source is a
          # backwards-compatible addition, so the bump is always minor; the
          # `type: feature` label applied below is what actually drives it —
          # release-drafter's version resolver maps that label to a minor bump
          # when drafting the next release.
          latest_release=$(GH_TOKEN="${{ github.token }}" gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          if [[ "$latest_release" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            suggested_release="v${BASH_REMATCH[1]}.$((BASH_REMATCH[2] + 1)).0"
            version_line="Version Bump Type: [minor] - 🤖 (automated) — latest release is \`$latest_release\`, this ships in \`$suggested_release\`"
          else
            version_line="Version Bump Type: [minor] - 🤖 (automated)"
          fi

          methods_md=$(printf '%s' "$METHODS" | sed 's/, /`, `/g; s/^/`/; s/$/`/')

          # Body structure mirrors the Speakeasy generation PRs on
          # latitudesh-go-sdk (e.g. #130): summary + coverage bump up top, a
          # keep-or-drop callout, surface changes as bullets, a facts table,
          # verbose material folded into <details>, attribution footer.
          {
            echo "# Provider scaffold"
            echo
            echo "## Versioning"
            echo
            echo "$version_line"
            echo
            echo "> [!TIP]"
            echo "> A new resource or data source is a backwards-compatible addition, so the bump is always **minor**. The \`type: feature\` label on this PR feeds release-drafter's version resolver, and the draft release picks it up on merge."
            echo
            echo "## Coverage"
            echo
            echo "Coverage Bump: [${COVERED_BEFORE} → ${covered_after} of ${TOTAL_GROUPS} SDK service groups] - 🤖 (automated)"
            echo
            echo "> [!TIP]"
            echo "> Reviewing this PR is where the keep-or-drop decision is made. **Keep it** — merge, and \`$GROUP\` is covered. **Drop it** — close this PR **and** record a \`ceiling\` + \`rationale\` under \`$GROUP\` in \`sdk-coverage.yaml\`, so it stops being regenerated."
            echo
            echo "## Provider Changes:"
            echo
            echo "* \`$TF_NAME\` — **New** ($KINDS) for SDK group \`$GROUP\`, CRUD shape \`$CRUD\`"
            echo "* SDK methods on the group: $methods_md"
            echo "* Registered in \`latitudesh/provider.go\`, with docs template, example, and tests"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| SDK version | \`$SDK_VERSION\` |"
            echo "| Pending groups | ${PENDING_BEFORE} → ${pending_after} |"
            echo
            echo "<details>"
            echo "<summary>Manifest notes</summary>"
            echo
            echo "> $NOTES"
            echo
            echo "</details>"
            echo
            echo "<details>"
            echo "<summary>Agent handoff — not verified offline</summary>"
            echo
            echo "$handoff"
            echo
            echo "</details>"
            echo
            echo "<details>"
            echo "<summary>Validation report</summary>"
            echo
            echo "Every gate step passed before this PR was opened: diff scope, forbidden-content grep, gofmt, go vet, go build, unit tests (incl. \`TestProviderSDKCoverage\`), coverage reconcile, docs regeneration, per-kind registration and deliverables."
            echo
            echo "The gate proves the scaffold is well-formed, **not that it is correct** — that is what the checklist below is for."
            echo
            echo "</details>"
            echo
            echo "<details>"
            echo "<summary>Manual validation (copy-paste)</summary>"
            echo
            # Fully literal template (quoted heredoc — backticks, \$(...) and the
            # inner heredocs must reach the reviewer verbatim); the three
            # run-specific values are spliced by sed. The inner terminators are
            # EOF, which never collides with MANUAL_EOF.
            cat <<'MANUAL_EOF' | sed -e "s|__BRANCH__|$branch|g" -e "s|__REPO__|$GH_REPO|g" -e "s|__EXAMPLE__|examples/$TF_NAME.tf|g"
          The agent's acceptance tests run against a local mock — nothing in this PR touched the real API. The snippets below build this branch and exercise the resource end-to-end against the real API. Credentials are separate blocks so you can paste them independently.

          **1. Token:**

          ```bash
          export LATITUDESH_AUTH_TOKEN="<your-api-token>"
          ```

          **2. Test project** (ID or slug; used as the provider-level default — harmless for resources that do not take a project):

          ```bash
          export LATITUDESH_PROJECT="<test-project-id-or-slug>"
          ```

          **3. Build this branch and apply the example:**

          ```bash
          workdir=$(mktemp -d)
          git clone --depth 1 --branch __BRANCH__ \
            https://github.com/__REPO__.git "$workdir/provider"
          make -C "$workdir/provider" build   # binary lands at the repo root — do NOT `make install`

          cat > "$workdir/dev.tfrc" <<EOF
          provider_installation {
            dev_overrides {
              "latitudesh/latitudesh" = "$workdir/provider"
            }
            direct {}
          }
          EOF
          export TF_CLI_CONFIG_FILE="$workdir/dev.tfrc"

          mkdir "$workdir/manual-test" && cd "$workdir/manual-test"
          cat > provider.tf <<EOF
          terraform {
            required_providers {
              latitudesh = { source = "latitudesh/latitudesh" }
            }
          }

          provider "latitudesh" {
            project = "$LATITUDESH_PROJECT"
          }
          EOF
          cp "$workdir/provider/__EXAMPLE__" main.tf
          # The example is gate-enforced to be self-contained; note it may declare
          # helper resources it depends on, and apply will create those too.

          terraform plan     # dev_overrides active: no init needed; expect the overrides warning
          terraform apply
          terraform state show "$(terraform state list | head -1)"
          terraform destroy
          ```
          MANUAL_EOF
            echo
            echo "</details>"
            echo
            echo "## Reviewer checklist"
            echo
            echo "- [ ] Endpoints verified against production (mandatory when the manifest notes flag spec gaps)"
            echo "- [ ] Schema reviewed: types, required vs optional, sensitive fields that would land in state"
            echo "- [ ] Acceptance test exercised — record a cassette (\`LATITUDE_TEST_RECORDER=record\`) or note why it runs live-only"
            echo "- [ ] Docs and example read sensibly, not just generated-correct"
            echo "- [ ] Remove the \`skip-e2e\` label (and re-run the checks) to exercise the full acceptance suite"
            echo
            echo "---"
            echo
            echo "Generated from [\`latitudesh-go-sdk\`](https://github.com/latitudesh/latitudesh-go-sdk) \`$SDK_VERSION\` by the [sdk-watch workflow]($RUN_URL) — prompt v${prompt_version:-?}."
            echo
            echo "<!-- scaffold:$GROUP -->"
          } > pr-body.md

          # Label creation is an issues-API write (default token, issues: write);
          # attaching labels to the PR is a PR mutation, which the read-scoped
          # default token cannot do — that goes through the app token. The labels
          # MUST land: dedupe, the open-PR cap, and parking all key off them.
          GH_TOKEN="${{ github.token }}" gh label create scaffold --color 5319e7 \
            --description "Agent-scaffolded SDK coverage PR" 2>/dev/null || true
          GH_TOKEN="${{ github.token }}" gh label create "scaffold:${GROUP}" --color 5319e7 \
            --description "Scaffold PR for SDK group ${GROUP}" 2>/dev/null || true
          GH_TOKEN="${{ github.token }}" gh label create "type: feature" --color 0e8a16 \
            --description "New user-facing functionality" 2>/dev/null || true
          GH_TOKEN="${{ github.token }}" gh label create skip-e2e --color ededed \
            --description "Skip the acceptance suite on this PR" 2>/dev/null || true

          # Draft first, label, THEN mark ready. Creating the PR non-draft would
          # race test.yml: the `opened` event fires before any label exists, so
          # e2e would see no skip-e2e and launch the full live acceptance suite
          # on every agent PR. The ready_for_review event sees the labels.
          # Labeling and readying are idempotent, so a reused PR from a previous
          # attempt just gets its lifecycle finished here — its body stays as
          # written by the attempt whose tree is actually on the branch.
          url="$reuse_pr"
          if [ -z "$url" ]; then
            url=$(GH_TOKEN="$APP_TOKEN" gh pr create --draft \
              --head "$branch" \
              --title "feat(${short}): 🤖 scaffold ${TF_NAME} from SDK group ${GROUP}" \
              --body-file pr-body.md)
          fi
          GH_TOKEN="$APP_TOKEN" gh pr edit "$url" \
            --add-label scaffold --add-label "scaffold:${GROUP}" \
            --add-label "type: feature" --add-label skip-e2e
          if [ "$(GH_TOKEN="$APP_TOKEN" gh pr view "$url" --json isDraft --jq '.isDraft')" = "true" ]; then
            GH_TOKEN="$APP_TOKEN" gh pr ready "$url"
          fi
          echo "PR (ready for review): $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the transcript
        if: steps.select.outputs.has_work == 'true' && steps.agent.outputs.execution_file != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scaffold-transcript
          path: ${{ steps.agent.outputs.execution_file }}
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore

      # A failed run must stay loud and inspectable: the tree the agent left
      # behind and its transcript go up as artifacts, the tracking issue gets a
      # note, and the job exits red — a silent green failure is the one outcome
      # this pipeline is not allowed to produce. These live at the END of the job
      # so they also cover mint/push/PR failures: a failure() step earlier in the
      # list would already have been skipped-as-success by the time those run.
      - name: Capture the failed tree
        if: failure() && steps.select.outputs.has_work == 'true'
        run: |
          set -uo pipefail
          git add -A
          git diff --cached HEAD > scaffold-failure.patch || true
          git status --porcelain > scaffold-failure-status.txt || true
          # Artifacts on a public repo are publicly downloadable. The gate greps
          # the diff for key material and FAILS on a hit — which is exactly when
          # this path runs — so the same patterns must gate what gets uploaded,
          # or the failure artifact would publish the very secret the gate caught.
          if grep -Eq 'sk-ant-|ANTHROPIC_API_KEY|BEGIN[ A-Z]*PRIVATE KEY' scaffold-failure.patch; then
            echo "patch withheld: it matches a key-material pattern; inspect the run log instead" > scaffold-failure.patch
            echo "::warning::failure patch withheld — key-material pattern detected in the agent's tree"
          fi

      - name: Upload failure artifacts
        if: failure() && steps.select.outputs.has_work == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scaffold-failure
          path: |
            /tmp/scaffold-prompt.md
            ${{ steps.agent.outputs.execution_file }}
            scaffold-failure.patch
            scaffold-failure-status.txt
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore

      - name: Note the failure on the tracking issue
        if: failure() && steps.select.outputs.has_work == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP: ${{ steps.select.outputs.group }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          existing=$(gh issue list --label sdk-coverage --state open --limit 100 \
            --json number,body --jq \
            'map(select(.body | contains("<!-- sdk-coverage-tracking -->"))) | sort_by(.number) | .[0].number // empty')
          [ -n "$existing" ] || exit 0
          gh issue comment "$existing" --body "Scaffold run for \`$GROUP\` failed — no PR was opened. Transcript and diff: $RUN_URL"
