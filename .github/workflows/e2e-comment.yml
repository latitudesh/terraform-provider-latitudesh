name: "Run E2E on comment"

# Comment `/run-e2e <sha>` on a pull request to run the acceptance suite on demand.
# This is the escape hatch for the `skip-e2e` label in test.yml: removing a label
# does not re-trigger a run, so without this a PR that opted out would have no way
# back short of pushing an empty commit. It also covers the ordinary "run it again"
# case.
#
# The suite runs the pull request's own code with LATITUDESH_AUTH_TOKEN in scope,
# so this workflow is written to fail closed. Two properties matter and are both
# enforced below, not in the trigger:
#
#   1. Only a user with real write access can start a run. `author_association`
#      (OWNER/MEMBER/COLLABORATOR) is NOT that — a collaborator can hold read or
#      triage, and an org member need not have write on this repo — so the actual
#      permission is read from the API and the job fails if it is not write/admin.
#
#   2. Authorization is bound to one immutable commit. The command must name the
#      SHA, it is checked against the PR's current head, and that exact head SHA is
#      captured and checked out. If a fork pushes a new commit after the comment,
#      the named SHA no longer matches the head and the run is rejected instead of
#      silently executing code nobody authorized.
#
# Third-party actions are pinned to commit SHAs (not moving tags) because this is a
# privileged workflow that executes untrusted PR code.
on:
  issue_comment:
    types:
      - created

# issue_comment runs the workflow from the default branch, so this file only takes
# effect once merged to main. Least privilege: read to check out and to read the
# commenter's permission and the PR head; issues:write only to react and to reply
# with the corrected command.
permissions:
  contents: read
  pull-requests: read
  issues: write

env:
  # Match test.yml: run every acceptance test. The prefix picks up new TestAcc*
  # automatically instead of relying on a hand-maintained allowlist.
  ACCEPTANCE_TESTS: "TestAcc"

jobs:
  e2e:
    # Cheap pre-filter only — the security boundary is the two steps below, not
    # this condition. issue_comment also fires on plain issues; the suite needs a
    # PR to resolve a head SHA from.
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/run-e2e')
    runs-on: ubuntu-latest
    # Share test.yml's concurrency group. Groups are repository-wide, so a
    # comment-triggered run serializes behind any in-flight pull_request run
    # against the one shared Latitude account/project instead of racing it and
    # colliding on resource names. Never cancel in progress: that leaks
    # half-created resources.
    concurrency:
      group: latitudesh-acceptance-tests
      cancel-in-progress: false
    steps:
      -
        # Read the commenter's effective permission on THIS repo (covers access
        # granted directly or via a team) and fail unless it is write or admin.
        # getCollaboratorPermissionLevel collapses maintain->write and triage->read,
        # so checking write/admin also admits maintainers. An unauthorized commenter
        # gets no reply here on purpose — only a failed check — so the command is not
        # a way to make the bot post on arbitrary PRs.
        name: Verify commenter has write access
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const actor = context.payload.comment.user.login;
            let level;
            try {
              const res = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor,
              });
              level = res.data.permission;
            } catch (e) {
              core.setFailed(`Could not verify repository permission for ${actor}: ${e.message}`);
              return;
            }
            if (level !== 'admin' && level !== 'write') {
              core.setFailed(`${actor} has '${level}' permission; /run-e2e requires write access.`);
              return;
            }
            core.info(`${actor} has '${level}' permission — authorized.`);
      -
        # Bind this authorization to a single immutable commit. The command must
        # name the SHA; it must match the PR's current head; and the full head SHA
        # is captured here and is what later steps check out. A post-comment push
        # moves the head away from the named SHA and lands in the mismatch branch,
        # so newer, unreviewed code can never ride in on an older authorization.
        name: Resolve and pin the authorized commit
        id: pin
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const head = pr.data.head.sha;
            const reply = async (body) => {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.setFailed(body);
            };
            const m = (context.payload.comment.body || '').match(/\/run-e2e\s+([0-9a-fA-F]{7,40})\b/);
            if (!m) {
              await reply(`\`/run-e2e\` must name the commit to run, so the run is bound to a reviewed revision:\n\n\`\`\`\n/run-e2e ${head}\n\`\`\``);
              return;
            }
            const named = m[1].toLowerCase();
            if (!head.toLowerCase().startsWith(named)) {
              await reply(`\`${named}\` is not the current head of this PR (head is \`${head}\`). Re-issue against the head you intend to run:\n\n\`\`\`\n/run-e2e ${head}\n\`\`\``);
              return;
            }
            core.setOutput('sha', head);
            core.info(`Authorized commit pinned: ${head}`);
      -
        # Best-effort acknowledgement, reached only after both checks pass. Non-fatal
        # so a reaction that fails on permissions cannot block the run.
        name: Acknowledge the command
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });
      -
        # Check out exactly the pinned SHA. persist-credentials:false keeps the
        # GITHUB_TOKEN out of the git config: the acceptance run executes PR code and
        # must not inherit a token it has no reason to use.
        name: Checkout the pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.pin.outputs.sha }}
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '^1.23.0'
      -
        name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      -
        name: Install dependencies
        run: go get .
      -
        # Mirrors the e2e step in test.yml. The selector is a fixed env value, never
        # the comment body, so there is no way to splice shell into this step — the
        # one step that holds LATITUDESH_AUTH_TOKEN. The 180m timeout is far above
        # how long the suite takes: go test enforces -timeout by killing the binary,
        # so a tight cap would skip destroy/teardown and leak billable servers.
        name: Run E2E Tests
        run: go test ./latitudesh -v -timeout 180m -run "$ACCEPTANCE_TESTS"
        env:
          TF_ACC: '1'
          LATITUDESH_AUTH_TOKEN: ${{ secrets.LATITUDESH_AUTH_TOKEN }}
